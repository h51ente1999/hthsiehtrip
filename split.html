<style>

.btn:hover{border-color:var(--accent)}

<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id)};
var APP="travel-spots-v1";
var CURS=[["KRW","韓元","₩"],["JPY","日圓","¥"],["USD","美元","$"],["EUR","歐元","€"],["THB","泰銖","฿"],["CNY","人民幣","¥"],["HKD","港幣","HK$"],["SGD","新加坡幣","S$"],["MYR","馬來幣","RM"],["VND","越南盾","₫"],["GBP","英鎊","£"],["AUD","澳幣","A$"],["PHP","披索","₱"],["IDR","印尼盾","Rp"]];
var CUR={};CURS.forEach(function(c){CUR[c[0]]={c:c[0],n:c[1],s:c[2]}});
function uid(){var a=crypto.getRandomValues(new Uint8Array(9));return Array.prototype.map.call(a,function(x){return x.toString(36).padStart(2,"0")}).join("").slice(0,12)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
var toastT=null;
function toast(t){var el=$("toast");el.textContent=t;el.classList.add("on");clearTimeout(toastT);toastT=setTimeout(function(){el.classList.remove("on")},2000)}
var ICO={
  plus:'<path d="M12 5v14M5 12h14"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',
  pen:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
  trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/>',
  img:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/>',
  clip:'<rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4h6v3H9z"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>',
  copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>',
  refresh:'<path d="M20 11a8 8 0 0 0-14-4M4 4v4h4M4 13a8 8 0 0 0 14 4M20 20v-4h-4"/>',
  arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>'
};
function ico(n,sz){return '<svg viewBox="0 0 24 24" width="'+(sz||16)+'" height="'+(sz||16)+'" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICO[n]+'</svg>'}

/* ---------- 儲存：IndexedDB（只在這個瀏覽器；無法使用時退回記憶體） ---------- */
var DB=null,MEMONLY=false,LEDGERS=[];
function dbOpen(){
  return new Promise(function(res){
    try{
      var rq=indexedDB.open("split-v1",1);
      rq.onupgradeneeded=function(){rq.result.createObjectStore("ledgers",{keyPath:"id"})};
      rq.onsuccess=function(){DB=rq.result;res()};
      rq.onerror=rq.onblocked=function(){MEMONLY=true;res()};
    }catch(e){MEMONLY=true;res()}
  });
}
function dbAll(){
  return new Promise(function(res){
    if(!DB){res([]);return}
    try{var rq=DB.transaction("ledgers").objectStore("ledgers").getAll();rq.onsuccess=function(){res(rq.result||[])};rq.onerror=function(){res([])}}catch(e){res([])}
  });
}
function dbPut(L){
  if(!DB)return Promise.resolve();
  return new Promise(function(res){
    try{var tx=DB.transaction("ledgers","readwrite");tx.objectStore("ledgers").put(L);tx.oncomplete=function(){res()};tx.onerror=tx.onabort=function(){toast("儲存失敗，瀏覽器空間可能已滿。");res()}}catch(e){res()}
  });
}
function dbDel(id){
  if(!DB)return Promise.resolve();
  return new Promise(function(res){try{var tx=DB.transaction("ledgers","readwrite");tx.objectStore("ledgers").delete(id);tx.oncomplete=function(){res()};tx.onerror=function(){res()}}catch(e){res()}});
}
var saveT=null;
function persist(){var L=cur();if(!L||L.cloud)return;L.ts=Date.now();clearTimeout(saveT);saveT=setTimeout(function(){dbPut(L)},60)}

/* ---------- 讀旅遊網的行程清單（同網域才讀得到；讀不到也能獨立使用） ---------- */
function readTrips(){
  try{var x=JSON.parse(localStorage.getItem(APP+"-idx")||"null");if(x&&Array.isArray(x.list))return x.list.filter(function(e){return e&&typeof e.id==="string"}).map(function(e){return {id:e.id,name:String(e.name||"（未命名行程）")}})}catch(e){}
  return [];
}
function tripCur(id){
  try{var d=JSON.parse(localStorage.getItem(APP+"-t-"+id)||"null");if(d&&CUR[d.cur])return d.cur}catch(e){}
  try{var f=localStorage.getItem(APP+"-fxdef");if(CUR[f])return f}catch(e){}
  return "KRW";
}
function appRate(code){try{var f=JSON.parse(localStorage.getItem(APP+"-fx")||"null");if(f&&f[code]&&f[code].r>0&&Date.now()-f[code].t<24*3600000)return {r:f[code].r,t:f[code].t}}catch(e){}return null}
function fetchRate(code){
  var lc=code.toLowerCase();
  return fetch("https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/"+lc+".json").then(function(r){return r.json()}).then(function(j){var v=j&&j[lc]&&Number(j[lc].twd);if(!(v>0))throw 0;return v});
}

/* ---------- 狀態與計算 ---------- */
var S={id:"",F:null};
function cur(){
  for(var i=0;i<LEDGERS.length;i++)if(LEDGERS[i].id===S.id){
    var x=LEDGERS[i];
    if(x.cloud)return CLED&&CLED.meta.id===x.id?CLED.L:null;
    return x;
  }
  return null;
}
function twd(e){return e.ccy==="TWD"?e.amount:e.amount*(e.rate||0)}
function nf(n,d){return Number(n).toLocaleString("en-US",{minimumFractionDigits:d||0,maximumFractionDigits:d||0})}
function money(n,ccy){
  if(ccy==="TWD")return "NT$ "+nf(Math.round(n));
  var c=CUR[ccy];var dec=(ccy==="USD"||ccy==="EUR"||ccy==="GBP"||ccy==="SGD"||ccy==="AUD"||ccy==="HKD"||ccy==="CNY"||ccy==="MYR"||ccy==="THB")?2:0;
  var v=Number(n);if(dec===2&&Math.abs(v-Math.round(v))<0.005)dec=0;
  return (c?c.s:ccy+" ")+" "+nf(v,dec);
}
function mname(L,id){for(var i=0;i<L.members.length;i++)if(L.members[i].id===id)return L.members[i].name;return "（已刪除）"}
function calc(L){
  var paid={},owed={},tot=0;
  L.members.forEach(function(m){paid[m.id]=0;owed[m.id]=0});
  L.expenses.forEach(function(e){
    var t=twd(e);tot+=t;
    if(paid[e.payer]!=null)paid[e.payer]+=t;
    Object.keys(e.shares||{}).forEach(function(id){if(owed[id]!=null)owed[id]+=t*e.shares[id]/100});
  });
  var net={},nr={},sum=0,big=null;
  L.members.forEach(function(m){net[m.id]=paid[m.id]-owed[m.id];nr[m.id]=Math.round(net[m.id]);sum+=nr[m.id];if(big===null||Math.abs(net[m.id])>Math.abs(net[big]))big=m.id});
  if(sum!==0&&big!==null)nr[big]-=sum;   /* 四捨五入的誤差併入差額最大的人，讓總和歸零 */
  var deb=[],cre=[];
  L.members.forEach(function(m){if(nr[m.id]<0)deb.push({id:m.id,v:-nr[m.id]});else if(nr[m.id]>0)cre.push({id:m.id,v:nr[m.id]})});
  deb.sort(function(a,b){return b.v-a.v});cre.sort(function(a,b){return b.v-a.v});
  var tf=[],i=0,j=0;
  while(i<deb.length&&j<cre.length){
    var x=Math.min(deb[i].v,cre[j].v);if(x>0)tf.push({from:deb[i].id,to:cre[j].id,v:x});
    deb[i].v-=x;cre[j].v-=x;if(deb[i].v===0)i++;if(cre[j].v===0)j++;
  }
  return {paid:paid,owed:owed,net:nr,total:tot,tf:tf};
}

/* ---------- 彈窗 ---------- */
function modal(html,onMount,cls){
  $("modalHost").innerHTML='<div class="mask '+(cls||"")+'" id="mask"><div class="modal" role="dialog" aria-modal="true">'+html+'</div></div>';
  $("mask").addEventListener("mousedown",function(e){if(e.target===$("mask"))closeModal()});
  if(onMount)onMount();
}
function closeModal(){$("modalHost").textContent=""}
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&$("modalHost").firstChild)closeModal()});
function viewImg(src){
  $("modalHost").innerHTML='<div class="mask img" id="mask"><img alt="收據截圖"></div>';
  $("mask").firstChild.src=src;$("mask").onclick=closeModal;
}

/* ---------- 帳本選單 ---------- */
function drawLedgerSel(){
  var sel=$("ledgerSel");sel.textContent="";
  LEDGERS.slice().sort(function(a,b){return (b.ts||0)-(a.ts||0)}).forEach(function(L){var o=document.createElement("option");o.value=L.id;o.textContent=L.name+(L.cloud?"（共同）":(L.tripId?"":"（未連結行程）"));sel.appendChild(o)});
  sel.value=S.id;
  $("ledgerSel").parentNode.parentNode.hidden=false;
  $("noLedger").hidden=!!LEDGERS.length;
  $("ledgerView").hidden=!cur();
  drawCloudMsg();
}
function drawCloudMsg(){
  var x=LEDGERS.filter(function(L){return L.id===S.id})[0],cm=$("cloudMsg");
  cm.hidden=!(x&&x.cloud&&!cur());
  if(cm.hidden)return;
  var err=CLED&&CLED.err;
  cm.innerHTML='<div class="'+(err?"err":"muted")+'" style="margin:0">'+esc(err||"連線中…")+'</div>'+(err?'<div class="row"><button class="btn danger" type="button" id="cmRm">從這台裝置移除這個帳本</button></div>':'');
  if(err)$("cmRm").onclick=function(){removeMeta(x.id)};
}
function removeMeta(id){
  stopListen();LEDGERS=LEDGERS.filter(function(L){return L.id!==id});dbDel(id);
  S.id=LEDGERS.length?LEDGERS[0].id:"";openLedger(S.id);
}
$("ledgerSel").onchange=function(){openLedger(this.value)};
function openLedger(id){
  stopListen();
  S.id=id;S.F=null;drawLedgerSel();
  var x0=LEDGERS.filter(function(L){return L.id===id})[0];
  if(x0&&x0.cloud){startListen(x0);return}
  if(!cur())return;
  var L=cur();
  if(!L.rate||!(L.rate.r>0)){var ar=appRate(L.cur);if(ar){L.rate=ar;persist()}}
  if(!L.rate||!(L.rate.r>0)||Date.now()-L.rate.t>12*3600000)loadRate(false);
  drawAll();
}
function loadRate(manual){
  var L=cur();if(!L)return;var code=L.cur,id=L.id;
  fetchRate(code).then(function(r){
    var Lx=cur();if(!Lx||Lx.id!==id||Lx.cur!==code)return;
    Lx.rate={r:r,t:Date.now()};persist();
    if(Lx.cloud){if(Lx.role==="owner"&&API)API.updateLedger(Lx.id,{rate:Lx.rate}).catch(function(){});else if(CLED)CLED.rate=Lx.rate}
    var inp=$("fRate");if(inp&&S.F&&S.F.ccy!=="TWD"&&!S.F.rateTouched&&!S.F.id){S.F.rate=String(+r.toPrecision(5));inp.value=S.F.rate}
    drawSum();if(manual)toast("匯率已更新");
  },function(){if(manual)toast("取不到匯率，請手動輸入。")});
}

/* ---------- 共同編輯（Firebase：Google 登入的擁有者＋匿名登入的朋友） ---------- */
var CLED=null,ME=null,API=null,unsubCl=null,CLID=0;
function getApi(){return Promise.race([window.__cloudP,new Promise(function(r){setTimeout(function(){r(null)},12000)})])}
function b64u(buf){var b=new Uint8Array(buf),t="";for(var i=0;i<b.length;i++)t+=String.fromCharCode(b[i]);return btoa(t).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}

function equalShares(L,F){

}

/* ---------- 截圖 ---------- */
function shrink(file,cb){
  var url=URL.createObjectURL(file),im=new Image();
  im.onload=function(){
    var w=im.naturalWidth,h=im.naturalHeight,tries=[[1280,0.72],[1024,0.62],[800,0.55],[640,0.5]],i=0,d="";
    for(;i<tries.length;i++){
      var k=Math.min(1,tries[i][0]/Math.max(w,h));
      var cv=document.createElement("canvas");cv.width=Math.round(w*k);cv.height=Math.round(h*k);
      var cx=cv.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(im,0,0,cv.width,cv.height);
      d=cv.toDataURL("image/jpeg",tries[i][1]);
      if(d.length<=600000)break;   /* 共同編輯時每筆款項要小於 Firestore 的 1MB 上限 */
    }
    URL.revokeObjectURL(url);cb(d);
  };
  im.onerror=function(){URL.revokeObjectURL(url);toast("這個檔案讀不出圖片")};
  im.src=url;
}

function cleanMeta(x){
  if(typeof x.id!=="string"||!/^[A-Za-z0-9_-]{8,64}$/.test(x.id)||typeof x.salt!=="string"||!/^[A-Za-z0-9_-]{8,64}$/.test(x.salt))return null;
  return {id:x.id,cloud:true,sid:x.id,salt:x.salt,name:typeof x.name==="string"&&x.name?x.name.slice(0,40):"共同帳本",ts:Number(x.ts)||0};
}
function cleanLedger(x){
  if(!x||typeof x!=="object"||typeof x.id!=="string"||!Array.isArray(x.members)||!Array.isArray(x.expenses))return null;
  var mem=x.members.filter(function(m){return m&&typeof m.id==="string"&&typeof m.name==="string"&&m.name}).map(function(m){return {id:m.id,name:m.name.slice(0,20)}});
  if(mem.length<2)return null;
  var ids={};mem.forEach(function(m){ids[m.id]=1});
  var exp=[];
  x.expenses.forEach(function(e){
    if(!e||typeof e!=="object")return;
    var a=Number(e.amount);if(!(a>0)||typeof e.date!=="string"||!ids[e.payer])return;
    var sh={},ok=false;Object.keys(e.shares||{}).forEach(function(k){var v=Number(e.shares[k]);if(ids[k]&&v>0){sh[k]=v;ok=true}});if(!ok)return;
    var ccy=e.ccy==="TWD"||CUR[e.ccy]?e.ccy:null;if(!ccy)return;
    var r=ccy==="TWD"?1:Number(e.rate);if(!(r>0))return;
    exp.push({id:typeof e.id==="string"?e.id:uid(),date:e.date.slice(0,10),title:typeof e.title==="string"?e.title.slice(0,60):"",amount:a,ccy:ccy,rate:r,pay:e.pay==="card"?"card":"cash",payer:e.payer,shares:sh,img:typeof e.img==="string"&&/^data:image\/(jpeg|png|webp);base64,/.test(e.img)?e.img:"",ts:Number(e.ts)||0});
  });
  var rt=x.rate&&Number(x.rate.r)>0?{r:Number(x.rate.r),t:Number(x.rate.t)||0}:null;
  return {id:x.id,tripId:typeof x.tripId==="string"?x.tripId:"",name:typeof x.name==="string"&&x.name?x.name.slice(0,40):"帳本",cur:CUR[x.cur]?x.cur:"KRW",rate:rt,members:mem,expenses:exp,ts:Number(x.ts)||Date.now()};
}
$("importIn").onchange=function(){
  var f=this.files&&this.files[0];this.value="";if(!f)return;
  f.text().then(function(t){
    var o=JSON.parse(t);if(!o||o.app!=="split"||!Array.isArray(o.ledgers))throw 0;
    var n=0;o.ledgers.forEach(function(x){var L=cleanLedger(x);if(!L)return;
      var i=LEDGERS.findIndex(function(y){return y.id===L.id});if(i>=0)LEDGERS[i]=L;else LEDGERS.push(L);dbPut(L);n++});
    closeModal();if(n){openLedger(S.id&&cur()?S.id:LEDGERS[0].id);toast("已匯入 "+n+" 個帳本（同編號的帳本已被覆蓋）")}else toast("備份檔裡沒有可用的帳本");
  }).catch(function(){toast("這不是分帳備份檔")});
};

/* ---------- 啟動 ---------- */
(async function(){
  await dbOpen();
  LEDGERS=(await dbAll()).map(function(x){return x&&x.cloud?cleanMeta(x):cleanLedger(x)}).filter(Boolean);
  var p=new URLSearchParams(location.search),trip=p.get("trip")||"";
  var pick="";
  if(trip){
    var found=LEDGERS.filter(function(L){return L.tripId===trip})[0];
    if(found)pick=found.id;
  }
  if(!pick&&LEDGERS.length)pick=LEDGERS.slice().sort(function(a,b){return (b.ts||0)-(a.ts||0)})[0].id;
  S.id=pick;drawLedgerSel();
  if(pick)openLedger(pick);
  if(trip&&!LEDGERS.some(function(L){return L.tripId===trip})){
    if(readTrips().some(function(t){return t.id===trip}))newLedgerModal(trip);
    else toast("找不到這個行程，請手動建立帳本。");
  }
  var jm=/^#j=([A-Za-z0-9_-]{8,64})\.([A-Za-z0-9_-]{8,64})$/.exec(location.hash||"");
  if(jm){
    var have=LEDGERS.filter(function(x){return x.id===jm[1]})[0];
    if(have)openLedger(have.id);else joinModal(jm[1],jm[2]);
  }
  if(history.replaceState&&(trip||jm))try{history.replaceState(null,"",location.pathname+location.search.replace(/[?&]trip=[^&]*/,""))}catch(e){}
})();
})();
