function dbAll(){
  return new Promise(function(res){

    try{var rq=DB.transaction("ledgers").objectStore("ledgers").getAll();rq.onsuccess=function(){res(rq.result||[])};rq.onerror=function(){res([])}}catch(e){res([])}
  });
}

    try{var tx=DB.transaction("ledgers","readwrite");tx.objectStore("ledgers").put(L);tx.oncomplete=function(){res()};tx.onerror=tx.onabort=function(){toast("儲存失敗，瀏覽器空間可能已滿。");res()}}catch(e){res()}

/* 判斷帳本是否屬於這個行程：編輯頁的行程編號，和分享頁的 s:分享編號，指的是同一個行程時視為同一本 */

  if(L.tripId===trip)return true;

  var g=tripShareTag(trip);return !!g&&L.tripId===g;
}
/* 綁定行程：已經綁到真正行程的帳本，不會被分享頁的 s: 標記蓋掉；s: 標記遇到真正行程編號則升級 */
function bindTrip(L,trip){

  if(/^s:/.test(trip)&&L.tripId&&!/^s:/.test(L.tripId))return;

function twd(e){return e.ccy==="TWD"?e.amount:e.amount*(e.rate||0)}
function nf(n,d){return Number(n).toLocaleString("en-US",{minimumFractionDigits:d||0,maximumFractionDigits:d||0})}
function money(n,ccy){
  if(ccy==="TWD")return "NT$ "+nf(Math.round(n));
  var c=CUR[ccy];var dec=(ccy==="USD"||ccy==="EUR"||ccy==="GBP"||ccy==="SGD"||ccy==="AUD"||ccy==="HKD"||ccy==="CNY"||ccy==="MYR"||ccy==="THB")?2:0;
  var v=Number(n);if(dec===2&&Math.abs(v-Math.round(v))<0.005)dec=0;

}
function mname(L,id){for(var i=0;i<L.members.length;i++)if(L.members[i].id===id)return L.members[i].name;return "（已刪除）"}
function calc(L){
  var paid={},owed={},tot=0;
  L.members.forEach(function(m){paid[m.id]=0;owed[m.id]=0});
  L.expenses.forEach(function(e){
    var t=twd(e);tot+=t;
    if(paid[e.payer]!=null)paid[e.payer]+=t;
    Object.keys(e.shares||{}).forEach(function(id){if(owed[id]!=null)owed[id]+=t*e.shares[id]/100});
  });
  var net={},nr={},sum=0,big=null;
  L.members.forEach(function(m){net[m.id]=paid[m.id]-owed[m.id];nr[m.id]=Math.round(net[m.id]);sum+=nr[m.id];if(big===null||Math.abs(net[m.id])>Math.abs(net[big]))big=m.id});
  if(sum!==0&&big!==null)nr[big]-=sum;   /* 四捨五入的誤差併入差額最大的人，讓總和歸零 */
  var deb=[],cre=[];
  L.members.forEach(function(m){if(nr[m.id]<0)deb.push({id:m.id,v:-nr[m.id]});else if(nr[m.id]>0)cre.push({id:m.id,v:nr[m.id]})});
  deb.sort(function(a,b){return b.v-a.v});cre.sort(function(a,b){return b.v-a.v});
  var tf=[],i=0,j=0;
  while(i<deb.length&&j<cre.length){
    var x=Math.min(deb[i].v,cre[j].v);if(x>0)tf.push({from:deb[i].id,to:cre[j].id,v:x});
    deb[i].v-=x;cre[j].v-=x;if(deb[i].v===0)i++;if(cre[j].v===0)j++;
  }
  return {paid:paid,owed:owed,net:nr,total:tot,tf:tf};
}

/* ---------- 自動幫行程開一本雲端帳本 ---------- */
function autoPw(){
  var A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",a=crypto.getRandomValues(new Uint8Array(8)),t="";
  for(var i=0;i<8;i++)t+=A[a[i]%A.length];
  return t;
}
function myDisplayName(u){
  var n=String((u&&u.displayName)||"").trim();
  if(!n){var e=String((u&&u.email)||"");n=e.split("@")[0]}
  n=n.split(/\s+/)[0]||"";
  return n.slice(0,20)||"我";
}
async function autoLedger(trip){
  var trips=readTrips(),tr=trips.filter(function(x){return x.id===trip})[0];
  if(!tr){newLedgerModal(trip);return}
  var api=await getApi();
  if(!api){toast("連不上雲端服務，先手動建立帳本。");newLedgerModal(trip);return}
  var u=null;try{u=await api.getUser()}catch(e){}
  if(!u||u.isAnonymous){
    modal('<h2>要先登入</h2><p class="muted small" style="margin:0">分帳和必買清單會存在雲端，請先到旅遊網用 Google 登入（同一個網域共用登入狀態），再回到這裡，帳本就會自動開好。</p><div class="row"><button class="btn pri" type="button" id="alOk">知道了</button></div>',function(){
      $("alOk").onclick=function(){closeModal();if(document.body.classList.contains("embed")){try{parent.postMessage({splitClose:1},"*")}catch(e){}}};
    });
    return;
  }
  if(LEDGERS.some(function(L){return sameTrip(L,trip)}))return;
  var busy=true;setBadge("sync","正在幫這個行程開帳本…");
  try{
    var pw=autoPw(),salt=b64u(crypto.getRandomValues(new Uint8Array(16))),hash=await pwHash(pw,salt),sid=b64u(crypto.getRandomValues(new Uint8Array(16)));
    var me={id:uid(),name:myDisplayName(u)};
    await api.createLedger(sid,{owner:u.uid,name:tr.name,cur:tripCur(trip),rate:null,members:[me],pwHash:hash,pwSalt:salt,ts:Date.now(),v:1},
      {uid:u.uid,data:{memberId:me.id,pwHash:hash,ts:Date.now()}},[]);
    var meta={id:sid,cloud:true,sid:sid,salt:salt,name:tr.name,tripId:trip,pw:pw,ts:Date.now()};
    LEDGERS.push(meta);dbPut(meta);openLedger(sid);
    toast("已自動幫「"+tr.name+"」開好帳本");
  }catch(e){
    setBadge("bad","開帳本失敗");
    modal('<h2>開帳本失敗</h2><p class="muted small" style="margin:0">'+esc((e&&e.code)||"網路或權限問題")+'。可以改成手動建立。</p><div class="row"><button class="btn" type="button" id="alNo">關閉</button><button class="btn pri" type="button" id="alGo">手動建立</button></div>',function(){
      $("alNo").onclick=closeModal;$("alGo").onclick=function(){closeModal();newLedgerModal(trip)};
    });
  }
  busy=false;
}

function code128(s){
  var P="212222 222122 222221 121223 121322 131222 122213 122312 132212 221213 221312 231212 112232 122132 122231 113222 123122 123221 223211 221132 221231 213212 223112 312131 311222 321122 321221 312212 322112 322211 212123 212321 232121 111323 131123 131321 112313 132113 132311 211313 231113 231311 112133 112331 132131 113123 113321 133121 313121 211331 231131 213113 213311 213131 311123 311321 331121 312113 312311 332111 314111 221411 431111 111224 111422 121124 121421 141122 141221 112214 112412 122114 122411 142112 142211 241211 221114 413111 241112 134111 111242 121142 121241 114212 124112 124211 411212 421112 421211 212141 214121 412121 111143 111341 131141 114113 114311 411113 411311 113141 114131 311141 411131 211412 211214 211232 2331112".split(" ");
  var v=[104],sum=104,i,c;
  for(i=0;i<s.length;i++){c=s.charCodeAt(i)-32;if(c<0||c>94)c=0;v.push(c);sum+=c*(i+1)}
  v.push(sum%103);v.push(106);
  var out=[];v.forEach(function(k){P[k].split("").forEach(function(d){out.push(+d)})});

function pdfFromCanvases(cvs){

    obj(cid,function(){str("<</Length "+content.length+">>\nstream\n"+content+"\nendstream")});
    obj(iid,function(){str("<</Type/XObject/Subtype/Image/Width "+cv.width+"/Height "+cv.height+"/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length "+u.length+">>\nstream\n");add(u);str("\nendstream")});
  });

/* 自訂比例：填好 n-1 位，最後一位自動帶出剩下的比例（之後改動會跟著重算，自己改最後一位就不再自動） */
function autoLast(L,F,box){
  var ids=L.members.map(function(m){return m.id}),setBox=function(id,v){var i=box.querySelector('.shr[data-id="'+id+'"] .pc');if(i)i.value=v};
  var manual=ids.filter(function(id){return id!==F.autoId&&String(F.pct[id]).trim()!==""&&!isNaN(parseFloat(F.pct[id]))});
  var rest=ids.filter(function(id){return manual.indexOf(id)<0});
  if(manual.length===ids.length-1&&rest.length===1){
    var sum=0;manual.forEach(function(id){sum+=parseFloat(F.pct[id])});
    var v=Math.round((100-sum)*100)/100;
    if(v>=0){F.autoId=rest[0];F.pct[rest[0]]=String(v);setBox(rest[0],String(v));return}
  }
  if(F.autoId){F.pct[F.autoId]="";setBox(F.autoId,"");F.autoId=""}
}
function nfp(p){return (Math.round(p*100)/100)+"%"}
function submitForm(){
  var L=cur(),F=S.F,err=$("fErr");err.textContent="";
  var a=parseFloat(F.amount);if(!(a>0)){err.textContent="請輸入金額。";$("fAmt").focus();return}
  var rate=1;if(F.ccy!=="TWD"){rate=parseFloat(F.rate);if(!(rate>0)){err.textContent="請填匯率。";$("fRate").focus();return}}
  if(!F.date){err.textContent="請選日期。";return}
  var sh=curShares(L,F),keys=Object.keys(sh);
  if(!keys.length){err.textContent="至少要有一位參與分攤。";return}
  var sum=0;keys.forEach(function(k){sum+=sh[k]});
  if(Math.abs(sum-100)>=0.01){err.textContent="分攤比例合計要等於 100%（目前 "+(Math.round(sum*100)/100)+"%）。";return}
  var e={id:F.id||uid(),date:F.date,title:F.title.trim(),amount:a,ccy:F.ccy,rate:rate,pay:F.pay,payer:F.payer,shares:sh,note:(F.note||"").trim().slice(0,200),img:F.img||"",ts:Date.now()};
  if(L.cloud){
    if(!ME){err.textContent="尚未登入雲端，請重新整理頁面。";return}
    if(F.id){var old=L.expenses.filter(function(x){return x.id===F.id})[0];if(!old||!isMine(L,old)){err.textContent="只有上傳者能編輯這筆。";return}}
    e.by=ME.uid;
    API.saveExpense(L.id,e).catch(function(){toast("儲存失敗：沒有權限或網路中斷")});
  }else{
    if(F.id){L.expenses=L.expenses.map(function(x){return x.id===F.id?e:x})}else L.expenses.push(e);
    persist();
  }
  toast(F.id?"已更新":"已加入");
  if(F.id)S.fOpen=false;
  S.F=newF(L,F);drawAll();
  var amt=$("fAmt");if(amt&&!F.id)amt.focus();
}

/* ---------- 截圖 ---------- */
function shrink(file,cb){
  var url=URL.createObjectURL(file),im=new Image();
  im.onload=function(){
    var w=im.naturalWidth,h=im.naturalHeight,tries=[[1280,0.72],[1024,0.62],[800,0.55],[640,0.5]],i=0,d="";
    for(;i<tries.length;i++){
      var k=Math.min(1,tries[i][0]/Math.max(w,h));
      var cv=document.createElement("canvas");cv.width=Math.round(w*k);cv.height=Math.round(h*k);
      var cx=cv.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(im,0,0,cv.width,cv.height);
      d=cv.toDataURL("image/jpeg",tries[i][1]);
      if(d.length<=600000)break;   /* 共同編輯時每筆款項要小於 Firestore 的 1MB 上限 */
    }
    URL.revokeObjectURL(url);cb(d);
  };
  im.onerror=function(){URL.revokeObjectURL(url);toast("這個檔案讀不出圖片")};
  im.src=url;
}
function setImg(file){if(!file||!/^image\//.test(file.type)){toast("不是圖片檔");return}shrink(file,function(d){if(!S.F)return;S.F.img=d;drawThumb()})}
function drawThumb(){
  var w=$("fThumbW");if(!w)return;w.textContent="";
  if(!S.F||!S.F.img)return;
  var im=document.createElement("img");im.className="thumb";im.src=S.F.img;im.alt="截圖預覽";im.onclick=function(){viewImg(S.F.img)};
  var x=document.createElement("button");x.type="button";x.className="btn sm icon";x.style.width="32px";x.innerHTML=ico("x",14);x.title="移除圖片";x.setAttribute("aria-label","移除圖片");x.onclick=function(){S.F.img="";drawThumb()};
  w.appendChild(im);w.appendChild(x);
}
$("fileIn").onchange=function(){var f=this.files&&this.files[0];this.value="";if(f)setImg(f)};
function pasteImg(){
  if(!navigator.clipboard||!navigator.clipboard.read){toast("這個瀏覽器不支援從剪貼簿讀圖片，請用「選擇圖片」。");return}
  navigator.clipboard.read().then(function(items){
    for(var i=0;i<items.length;i++){
      var t=items[i].types.filter(function(x){return /^image\//.test(x)})[0];
      if(t){items[i].getType(t).then(function(b){setImg(new File([b],"paste.png",{type:b.type}))});return}
    }
    toast("剪貼簿裡沒有圖片，請先複製一張圖片。");
  },function(){toast("無法讀取剪貼簿，請允許貼上權限，或改用「選擇圖片」。")});
}
document.addEventListener("paste",function(e){
  if(!cur()||$("modalHost").firstChild)return;
  var items=e.clipboardData&&e.clipboardData.items;if(!items)return;
  for(var i=0;i<items.length;i++)if(items[i].kind==="file"&&/^image\//.test(items[i].type)){e.preventDefault();setImg(items[i].getAsFile());return}
});

function cleanMeta(x){
  if(typeof x.id!=="string"||!/^[A-Za-z0-9_-]{8,64}$/.test(x.id)||typeof x.salt!=="string"||!/^[A-Za-z0-9_-]{8,64}$/.test(x.salt))return null;
  return {id:x.id,cloud:true,sid:x.id,salt:x.salt,name:typeof x.name==="string"&&x.name?x.name.slice(0,40):"共同帳本",tripId:typeof x.tripId==="string"?x.tripId:"",pw:typeof x.pw==="string"?x.pw.slice(0,24):"",ts:Number(x.ts)||0};
}
function cleanLedger(x){
  if(!x||typeof x!=="object"||typeof x.id!=="string"||!Array.isArray(x.members)||!Array.isArray(x.expenses))return null;
  var mem=x.members.filter(function(m){return m&&typeof m.id==="string"&&typeof m.name==="string"&&m.name}).map(function(m){return {id:m.id,name:m.name.slice(0,20)}});
  if(mem.length<2)return null;
  var ids={};mem.forEach(function(m){ids[m.id]=1});
  var exp=[];
  x.expenses.forEach(function(e){
    if(!e||typeof e!=="object")return;
    var a=Number(e.amount);if(!(a>0)||typeof e.date!=="string"||!ids[e.payer])return;
    var sh={},ok=false;Object.keys(e.shares||{}).forEach(function(k){var v=Number(e.shares[k]);if(ids[k]&&v>0){sh[k]=v;ok=true}});if(!ok)return;
    var ccy=e.ccy==="TWD"||CUR[e.ccy]?e.ccy:null;if(!ccy)return;
    var r=ccy==="TWD"?1:Number(e.rate);if(!(r>0))return;
    exp.push({id:typeof e.id==="string"?e.id:uid(),date:e.date.slice(0,10),title:typeof e.title==="string"?e.title.slice(0,60):"",amount:a,ccy:ccy,rate:r,pay:e.pay==="card"?"card":"cash",payer:e.payer,shares:sh,note:typeof e.note==="string"?e.note.slice(0,200):"",img:typeof e.img==="string"&&/^data:image\/(jpeg|png|webp);base64,/.test(e.img)?e.img:"",ts:Number(e.ts)||0});
  });
  var rt=x.rate&&Number(x.rate.r)>0?{r:Number(x.rate.r),t:Number(x.rate.t)||0}:null;
  return {id:x.id,tripId:typeof x.tripId==="string"?x.tripId:"",name:typeof x.name==="string"&&x.name?x.name.slice(0,40):"帳本",cur:CUR[x.cur]?x.cur:"KRW",rate:rt,members:mem,expenses:exp,ts:Number(x.ts)||Date.now()};
}

function tripFlow(trip,view){
  var tids=readTrips().map(function(x){return x.id});
  FREE_LEDGERS=LEDGERS.filter(function(L){return !L.tripId||(!/^s:/.test(L.tripId)&&tids.length&&tids.indexOf(L.tripId)<0)});
  if(trip&&!LEDGERS.some(function(L){return sameTrip(L,trip)})){
  PENDING_TRIP=trip;
  if(view){(async function(){
    var api=await getApi(),sp=null;
    try{if(api&&api.getShareSplit)sp=await api.getShareSplit(view)}catch(e){}
    if(sp&&/^[A-Za-z0-9_-]{8,64}$/.test(sp.sid)&&/^[A-Za-z0-9_-]{8,64}$/.test(sp.salt)){
      var have=LEDGERS.filter(function(x){return x.id===sp.sid})[0];
      if(have){bindTrip(have,trip);openLedger(have.id)}else joinModal(sp.sid,sp.salt,trip);
    }else joinLinkModal(trip);
  })()}
  else if(readTrips().some(function(t){return t.id===trip})){tryOwnLink(trip).then(function(ok){if(ok||LEDGERS.some(function(L){return sameTrip(L,trip)}))return;if(FREE_LEDGERS.length)linkExistingModal(trip,FREE_LEDGERS);else autoLedger(trip)})}
  else toast("找不到這個行程，請手動建立帳本。");
}
}

      var tr=readTrips().filter(function(t){return t.id===trip})[0];

      var tids=readTrips().map(function(x){return x.id});
      var isFree=function(L){return !L.tripId||(!/^s:/.test(L.tripId)&&tids.length&&tids.indexOf(L.tripId)<0)};   /* 沒連結，或連結的行程已經不存在 */
      if(tr&&tr.name&&nz(tr.name)){var cand=LEDGERS.filter(function(L){var x=nz(L.name),y=nz(tr.name);return isFree(L)&&x&&(x.indexOf(y)===0||y.indexOf(x)===0)}).sort(function(a,b){return (b.ts||0)-(a.ts||0)});
        if(cand.length){found=cand[0];found.tripId=trip;dbPut(found)}}
      FREE_LEDGERS=LEDGERS.filter(isFree);
    }
    if(found)pick=found.id;
  }
  if(!pick&&!trip&&LEDGERS.length)pick=LEDGERS.slice().sort(function(a,b){return (b.ts||0)-(a.ts||0)})[0].id;
  S.id=pick;drawLedgerSel();
  if(pick)openLedger(pick);
  if(AUTOSHARE&&trip&&!view&&found&&pick===found.id){if(!found.cloud){var ak="split-v1-asked-"+found.id,asked=false;try{asked=!!localStorage.getItem(ak);localStorage.setItem(ak,"1")}catch(e){}if(!asked)enableModal()}}
  TRIPCTX={trip:trip,view:view};

  var jm=/^#j=([A-Za-z0-9_-]{8,64})\.([A-Za-z0-9_-]{8,64})$/.exec(location.hash||"");
  if(jm){
    var have=LEDGERS.filter(function(x){return x.id===jm[1]})[0];
    if(have)openLedger(have.id);else joinModal(jm[1],jm[2]);
  }
  if(history.replaceState&&(trip||jm))try{history.replaceState(null,"",location.pathname+(location.search.replace(/[?&](trip|autoshare|view)=[^&]*/g,"")?location.search.replace(/[?&](trip|autoshare|view)=[^&]*/g,"").replace(/^&/,"?"):""))}catch(e){}
})();
})();

  });
