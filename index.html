<style>
html.pre body{visibility:hidden}
html.pre *{transition:none!important;animation:none!important}
:root{--page:#d8dfec;--blue:#5a8dbd;--on-blue:#ffffff;--tag-food:#c8805f;--dayg2:color-mix(in srgb,var(--blue) 55%,var(--tag-food))}
@media (prefers-color-scheme:dark){:root{--blue:#025373;--on-blue:#F2EBEB}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:linear-gradient(160deg,var(--blue),var(--dayg2));background-attachment:fixed;color:var(--on-blue);font:16px/1.4 "Huninn","Noto Serif TC",-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;min-height:100vh;min-height:100dvh;position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent}
.clock{position:absolute;left:0;right:0;top:46%;transform:translateY(-50%);text-align:center;padding:0 16px;animation:in .7s cubic-bezier(.3,.8,.3,1) both}
.date{font-size:clamp(1rem,4.2vw,1.35rem);letter-spacing:1px;opacity:.92}
.time{font-size:clamp(4.2rem,22vw,9rem);font-weight:300;letter-spacing:2px;line-height:1.05;margin-top:6px;font-variant-numeric:tabular-nums}
nav{position:absolute;left:0;right:0;bottom:max(12vh,64px);display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 16px;animation:in .7s .15s cubic-bezier(.3,.8,.3,1) both}
nav a{display:flex;width:150px;align-items:center;gap:8px;color:inherit;text-decoration:none;font-size:1.1rem;letter-spacing:.5px;padding:8px 4px;transition:opacity .2s,transform .2s cubic-bezier(.3,.8,.3,1)}
nav a:active{opacity:.6;transform:scale(.95)}
nav a svg{display:block;flex:none}
footer{position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));text-align:center;font-size:.74rem;opacity:.6}
footer a{color:inherit}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1}}
.clock{--y:-50%}
@keyframes inc{from{opacity:0;transform:translateY(calc(-50% + 12px))}to{opacity:1;transform:translateY(-50%)}}
.clock{animation-name:inc}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<script>(function(){var D={"--page":"#d8dfec","--blue":"#5a8dbd","--bg":"#f3f5fa","--surface":"#ffffff","--ink":"#232a3c","--on-blue":"#ffffff","--tag-food":"#c8805f","--blue2":"#8570b4"},th=D;
try{var r=localStorage.getItem("travel-spots-v1-theme");th=r===null?D:(JSON.parse(r||"{}")||{})}catch(e){th=D}
var st=document.documentElement.style;Object.keys(th).forEach(function(k){if(k!=="--hit")st.setProperty(k,th[k])});
if(th["--blue2"])st.setProperty("--dayg2",th["--blue2"]);
if(th["--blue"]&&!th["--on-blue"]){var n=parseInt(th["--blue"].slice(1),16),l=(0.299*(n>>16&255)+0.587*(n>>8&255)+0.114*(n&255))/255;st.setProperty("--on-blue",l>0.55?"#0D2626":"#fff")}})();</script>

<footer>© 2026 hthsieh</footer>
<script>
"use strict";
(function(){
var WD=["日","一","二","三","四","五","六"];
function p(n){return n<10?"0"+n:""+n}
function tick(){var n=new Date();
  document.getElementById("dt").textContent=n.getFullYear()+"年"+(n.getMonth()+1)+"月"+n.getDate()+"日 星期"+WD[n.getDay()];
  document.getElementById("tm").textContent=p(n.getHours())+":"+p(n.getMinutes());
  setTimeout(tick,60500-(n.getSeconds()*1000+n.getMilliseconds())-500);
}
tick();
document.addEventListener("visibilitychange",function(){if(!document.hidden)tick()});
requestAnimationFrame(function(){requestAnimationFrame(function(){document.documentElement.className=""})});
})();
</script>
