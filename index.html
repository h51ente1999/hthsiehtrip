<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>旅遊行程規劃</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233691c9'/%3E%3Cpath d='M32 12c-8.8 0-15.5 6.6-15.5 15 0 10.6 13.2 23.6 14.2 24.5.8.7 1.8.7 2.6 0C34.3 50.6 47.5 37.6 47.5 27c0-8.4-6.7-15-15.5-15z' fill='%23fff'/%3E%3Ccircle cx='32' cy='27' r='6.5' fill='%233691c9'/%3E%3C/svg%3E">
<script defer src="https://cdn.jsdelivr.net/npm/pptxgenjs@4.0.1/dist/pptxgen.bundle.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;700&display=swap">
<style>
:root{--page:#afc3d0;--page-ink:#F2EBEB;--page-muted:color-mix(in srgb,var(--page-ink) 78%,var(--page));--bg:#ffffff;--surface:#ffffff;--ink:#0D2626;--muted:#025E73;--line:#d3c7c7;--blue:#afc3d0;--accent-text:color-mix(in srgb,var(--blue) 40%,var(--ink));--blue-soft:#e6eef3;--on-blue:#ffffff;--hit:#3691c9;--tag-bg:#afc3d0;--tag-ink:#ffffff;--tag-food:#e8b08c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#123838;--surface:#0D2626;--ink:#F2EBEB;--muted:#7fc4bc;--line:#1f4a4a;--blue:#025373;--accent-text:#2EA69A;--blue-soft:#17403f;--on-blue:#F2EBEB;--hit:#2EA69A}}
:root[data-theme="dark"]{--bg:#123838;--surface:#0D2626;--ink:#F2EBEB;--muted:#7fc4bc;--line:#1f4a4a;--blue:#025373;--accent-text:#2EA69A;--blue-soft:#17403f;--on-blue:#F2EBEB;--hit:#2EA69A}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--page-ink);font:16px/1.5 "Noto Serif TC","Songti TC","PMingLiU","SimSun",serif}
main{max-width:1500px;margin:0 auto;padding:20px 16px 48px}
h2{font-size:1.05rem;margin:0 0 10px}
input[type=text].title{width:100%;font-size:1.6rem;font-weight:700;background:transparent;border:0;border-bottom:2px solid var(--line);color:var(--ink);padding:4px 0;margin-bottom:6px}
input[type=text].title::placeholder{color:var(--muted)}
input[type=text].title:focus{outline:none;border-color:var(--blue)}
p.hint{margin:0 0 16px;color:var(--muted);font-size:.9rem}
p.hint.top{color:var(--page-muted)}
.gmrow{display:flex;flex-wrap:wrap;gap:8px}
#gm{flex:1 1 200px;width:auto;height:42px;min-height:0;resize:none;overflow:hidden;line-height:1.4}
form.add[hidden]{display:none}
form.add{margin-top:12px}
main{position:relative}
.titlebar p.hint{margin:4px 0 0}
.sidehead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.sidehead h2{margin:0}
.selrow{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
#catFilter,#areaFilter,#dayJump,#dayW{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font:inherit;font-size:.88rem;max-width:150px}
input[type=datetime-local]{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%;font:inherit;color:var(--ink)}
.bottom{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:18px;align-items:start}
.bottom .panel{margin-bottom:0}
.legs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.leg h3{margin:0 0 6px;font-size:.95rem;color:var(--accent-text)}
.fld{display:flex;flex-direction:column;gap:2px;font-size:.82rem;color:var(--muted);margin-bottom:8px}
.hotel{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
.hotel:first-child{border-top:0;padding-top:0;margin-top:0}
.hdel{font-size:.8rem;padding:2px 10px;color:var(--muted)}
#addHotel{margin-top:10px}
@media (max-width:860px){.bottom{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){.legs{grid-template-columns:minmax(0,1fr)}}
.top{display:flex;gap:12px;align-items:center;margin-bottom:6px}
[hidden]{display:none!important}
.mlinks{display:flex;gap:8px;align-items:center}
.mi{display:inline-block;line-height:0}
.mi img{width:22px;height:22px;border-radius:6px;display:block}
*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
::placeholder{opacity:.4!important}
input[type=text].title::placeholder{opacity:.4}
p.hint:not(.top),.drop .empty,.settings p,#syncInfo{opacity:.6}
p.hint.top{opacity:.75}
.tripbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tripbar select{flex:1 1 180px;min-width:0;padding:8px 10px;border-radius:8px;border:0;background:var(--bg);color:var(--ink);font:inherit;font-weight:700}
.tripbar .sharebox{flex-basis:100%;display:flex;flex-wrap:wrap;gap:8px}
.tripbar .sharebox input{flex:1 1 220px;min-width:0}
.tripbar .sharebox .hint{flex-basis:100%;margin:0}
body.viewer main{display:none}
#viewer{max-width:760px;margin:0 auto;padding:20px 16px 48px}
#viewer h1{margin:0 0 6px}#viewer h2{margin:22px 0 8px;font-size:1.1rem}
#viewer .row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.vlist{display:grid;gap:8px}.vrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.vcard,.vitem{background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 12px}
.vitem{display:flex;gap:12px}.vth{width:84px;height:84px;object-fit:cover;border-radius:8px;background:var(--bg);flex:none}
.vbd{min-width:0;flex:1}.vbd .n{font-weight:700}.vsub{font-size:.9rem;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}
.vnote{font-size:.9rem;margin-top:4px;white-space:pre-wrap}.vtime{margin-right:6px}
.vtags{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:2px}.vtag{background:var(--tag-bg);color:var(--tag-ink);font-weight:700;font-size:.75rem;padding:1px 8px;border-radius:6px}.vtag.food{background:var(--tag-food)}
.vbd a{font-size:.85rem;color:var(--hit)}
.syncbadge{font-size:.8rem;color:var(--muted);white-space:nowrap}
.gear{color:var(--accent-text);border-color:var(--accent-text);background:transparent;font-size:1.2rem;line-height:1;padding:6px 10px}
.settings{position:absolute;right:32px;top:64px;z-index:30;width:290px;max-width:calc(100vw - 32px);max-height:calc(100vh - 90px);overflow-y:auto;background:#fff;color:#0D2626;border:1px solid #cfc4c4;border-radius:12px;padding:14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.settings[hidden]{display:none}
.settings h2{margin:0 0 8px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0;font-size:.92rem}
.srow input[type=color]{width:44px;height:28px;padding:0;border:1px solid #cfc4c4;border-radius:6px;background:transparent;cursor:pointer}
.settings .row{margin-top:10px}
.settings .row button{color:#025373;border-color:#025373}
.settings .bk{margin-top:14px;padding-top:10px;border-top:1px solid #e3d9d9}
.settings .bk h2{font-size:1rem}
.settings .bk p{margin:0 0 8px;font-size:.82rem;color:#025E73}
.settings textarea{width:100%;margin-top:8px;font-size:.78rem;border:1px solid #cfc4c4;border-radius:8px;padding:6px;background:#fff;color:#0D2626}
.layout{display:grid;grid-template-columns:340px minmax(0,1fr);grid-template-rows:minmax(0,1fr);gap:18px;align-items:stretch;height:78vh;min-height:460px}
.layout>.panel{margin-bottom:0;min-width:0;min-height:0;overflow-y:auto}
.layout>.panel.side{position:static}
.layout #lib{flex-direction:column;flex-wrap:nowrap}
.layout #lib .blk{width:100%}
@media (max-width:860px){.layout{grid-template-columns:minmax(0,1fr);grid-template-rows:none;height:auto;min-height:0}.layout>.panel.side{max-height:45vh}.layout>.panel:not(.side){overflow:visible}.layout #lib{flex-direction:row;flex-wrap:wrap}.layout #lib .blk{width:calc(50% - 4px)}}
@media (max-width:520px){.layout #lib .blk{width:100%}}
input,button{font:inherit;color:inherit}
input[type=text],textarea.f{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%;font:inherit;color:var(--ink)}
textarea.f{resize:vertical;min-height:2.6em}
input:focus-visible,button:focus-visible,.upload:focus-within,.blk:focus-visible{outline:2px solid var(--hit);outline-offset:2px}
button{cursor:pointer;border:1px solid var(--blue);background:transparent;color:var(--accent-text);border-radius:8px;padding:8px 14px}
button.primary{background:var(--blue);border-color:var(--blue);color:var(--on-blue);font-weight:700}
section.panel{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:18px}
form.add{display:grid;grid-template-columns:130px 1fr;gap:8px;align-items:center;margin-bottom:14px}
form.add .full{grid-column:1/-1}
form.add .acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.upload{position:relative;border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;color:var(--muted);white-space:nowrap;font-size:.9rem;display:flex;gap:6px;align-items:center}
.upload input{position:absolute;opacity:0;width:1px;height:1px}
.upload img{width:22px;height:22px;border-radius:4px;object-fit:cover}
#lib{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:4px;border-radius:10px;align-items:flex-start}
.dz.hit{outline:2px solid var(--hit);background:var(--blue-soft)}
.blk{position:relative;display:flex;gap:10px;align-items:flex-start;background:var(--bg);border:0;border-radius:10px;padding:6px;user-select:none;-webkit-user-select:none;cursor:pointer}
.blk .th{flex:0 0 38px;width:38px;height:38px;border-radius:7px;object-fit:cover;background:var(--blue-soft);display:grid;place-items:center;font-size:1rem}
.blk .bd{flex:1;min-width:0;padding-top:0}
.blk .bd .n:first-child{padding-top:8px}
.tag.food{background:var(--tag-food)}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:2px}
.tags .tag{margin-bottom:0}
.tag.area{background:transparent;color:var(--accent-text);box-shadow:inset 0 0 0 1px var(--accent-text)}
.chip.food[aria-pressed="true"],.blk .d .chip.food[aria-pressed="true"]{background:var(--tag-food);border-color:var(--tag-food)}

.blk .ko{font-size:.82rem;color:var(--muted);line-height:1.3;overflow-wrap:anywhere}
.blk .n{font-weight:500;line-height:1.3;overflow-wrap:anywhere}
.tag{display:block;width:fit-content;max-width:100%;margin-bottom:2px;font-weight:700;font-size:.72rem;line-height:1.5;padding:0 7px;border-radius:5px;background:var(--tag-bg);color:var(--tag-ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blk .d{margin-top:6px;padding-bottom:4px;font-size:.85rem;color:var(--muted);display:flex;flex-direction:column;gap:6px;align-items:stretch;cursor:auto;user-select:text;-webkit-user-select:text}
.blk .d input[type=text],.blk .d textarea{padding:5px 8px;font-size:.85rem}
.blk .d a{color:var(--accent-text)}
.blk .d button{align-self:flex-start;padding:2px 10px;font-size:.8rem;color:var(--muted)}
.blk .d .upload{align-self:flex-start;padding:2px 10px;font-size:.8rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip,.blk .d .chip{padding:2px 10px;font-size:.85rem;border-radius:999px;border:1px solid var(--accent-text);background:transparent;color:var(--accent-text);align-self:auto}
.chip[aria-pressed="true"],.blk .d .chip[aria-pressed="true"]{background:var(--tag-bg);color:var(--tag-ink);border-color:var(--tag-bg);font-weight:700}

.blk.open{background:var(--surface);box-shadow:0 2px 10px rgba(0,0,0,.2)}
#lib .blk{width:230px}
.days{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.day{flex:0 0 var(--dayw,300px);background:var(--surface);border-radius:14px;padding:12px}
.day header{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:8px}
.day header b{color:var(--accent-text)}
.day header span{color:var(--muted);font-size:.85rem;margin-left:auto}
.day header button{padding:0 8px;font-size:.8rem;color:var(--muted);background:transparent;border:0}
.drop{min-height:100px;display:flex;flex-direction:column;gap:6px;border:0;border-radius:10px;padding:6px}
.drop .blk{background:var(--bg)}
.slot{display:flex;flex-direction:column;gap:3px}
.itime{align-self:flex-start;width:auto;background:transparent;border:0;color:var(--muted);font:inherit;font-size:.82rem;padding:2px 0}
.inote{width:100%;min-height:28px;resize:none;overflow:hidden;background:color-mix(in srgb,var(--blue) 18%,var(--surface));border:0;border-radius:8px;padding:5px 8px;font:inherit;font-size:.82rem;line-height:1.4;color:var(--ink)}

.drop .empty{color:var(--muted);font-size:.85rem;margin:auto;text-align:center}
.ghost{position:fixed;z-index:50;pointer-events:none;opacity:.92;box-shadow:0 8px 20px rgba(13,42,82,.3)}
.blk.src{opacity:.35}
.addday{flex:0 0 auto;align-self:stretch;min-width:90px;border-style:solid;color:var(--muted);background:transparent}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.exrow{margin:0 0 18px}
.exrow button.primary{background:var(--surface);color:var(--accent-text);border-color:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.12)}
#out{display:none;width:100%;min-height:150px;margin-top:10px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit}
#prev{display:none;max-width:100%;max-height:60vh;object-fit:contain;margin-top:12px;border-radius:10px;border:1px solid var(--line)}
#msg{color:var(--muted);font-size:.85rem;margin:8px 0 0}
@media (max-width:640px){#lib .blk{width:100%}.day{flex-basis:min(var(--dayw,300px),86vw)}}
</style>
</head>
<body>
<section id="viewer" hidden><div class="vwrap"><h1 id="vTitle"></h1><p id="vInfo" class="hint"></p><div class="row"><button type="button" class="primary" id="vPdf">下載 PDF</button><button type="button" class="primary" id="vPpt">下載 PPT</button></div><div id="vBody"></div><p class="hint">這是唯讀的分享頁面，無法編輯。</p></div></section>
<main>
<section class="panel tripbar"><select id="tripSel" aria-label="切換行程"></select><button type="button" id="tripNew">＋ 新行程</button><button type="button" id="tripDup">複製</button><button type="button" id="tripDel">刪除</button><button type="button" id="tripShare" hidden>分享</button><span id="syncBadge" class="syncbadge" hidden></span><button type="button" class="gear" id="gear" aria-haspopup="dialog" aria-expanded="false" aria-label="顏色設定">⚙</button>
<div class="settings" id="settings" hidden role="dialog" aria-label="顏色設定"><h2>顏色設定</h2><div id="srows"></div><div class="row"><button type="button" id="sreset">還原預設</button><button type="button" id="sclose">關閉</button></div><div class="bk" id="syncBox" hidden><h2>雲端同步</h2><p id="syncInfo">登入後，行程會自動同步到你的其他裝置。</p><div class="row"><button type="button" id="syncIn">用 Google 登入</button><button type="button" id="syncOut" hidden>登出</button></div></div><div class="bk"><h2>資料備份</h2><p>備份包含景點、行程、圖片和顏色設定，可以用來搬到新網址或新裝置。</p><div class="row"><button type="button" id="bkSave">備份下載</button><button type="button" id="bkLoad">還原備份</button></div><input type="file" id="bkFile" accept=".json,application/json" hidden><textarea id="bkText" hidden readonly rows="4" aria-label="備份內容"></textarea><p id="bkMsg" role="status"></p></div></div>

<div class="sharebox" id="sharebox" hidden><input type="text" id="shareUrl" readonly aria-label="分享連結"><button type="button" id="shareCopy">複製連結</button><button type="button" id="shareStop">停止分享</button><p class="hint">拿到連結的人可以查看這份行程並下載 PDF／PPT，但不能修改。你修改後會自動更新。</p></div></section>
<section class="panel"><input class="title" id="title" type="text" placeholder="旅程名稱" aria-label="旅程名稱" style="margin-bottom:0"></section>
<section class="panel">
  <h2>新增景點</h2>
  <p class="hint">先把想去的地方加入景點庫，再拖到每天的行程。點一下景點可查看並編輯地址與備註；手機請長按景點再拖曳。</p>
  <div class="gmrow"><textarea id="gm" class="f" rows="1" placeholder="貼上完整的 Google 地圖連結（不支援 maps.app.goo.gl 短網址）" aria-label="Google 地圖連結"></textarea><button type="button" id="manual" aria-expanded="false" aria-controls="add">手動輸入</button></div>
  <form class="add" id="add" hidden>
    <div class="chips full" id="cchips" role="group" aria-label="分類"></div>
    <input class="full" type="text" id="n" placeholder="景點名稱" required aria-label="景點名稱">
    <div class="full"><input type="text" id="ar" placeholder="區域（例如：海雲臺、西面）" aria-label="區域"><div class="chips" id="achips" style="margin-top:6px"></div></div>
    <input class="full" type="text" id="ko" lang="ko" placeholder="韓文店名（手動輸入）" aria-label="韓文店名">
    <input class="full" type="text" id="a" placeholder="地址" aria-label="地址">
    <input class="full" type="text" id="nv" placeholder="Naver 地圖連結" aria-label="Naver 地圖連結">
    <input class="full" type="text" id="hr" placeholder="營業時間（例如：10:00–22:00，週一公休）" aria-label="營業時間">
    <textarea class="f full" id="nt" rows="2" placeholder="備註：營業時間、預約、想吃什麼…" aria-label="備註"></textarea>
    <div class="acts"><label class="upload"><input type="file" id="f" accept="image/*"><span id="upl">＋ 圖片</span></label>
    <button class="primary" type="submit">加入景點庫</button></div>
    
  </form>
  <p id="msg" role="status"></p>
</section>

<div class="row exrow" id="exportPanel">
  <button class="primary" id="exPpt">匯出 PPT</button>
  <button class="primary" id="exPdf">下載 PDF</button>
  <button class="primary" id="exImg">匯出圖片</button>
  <button class="primary" id="exTxt">複製文字</button>
</div>
<button type="button" id="exClose" hidden style="margin-top:10px">收合預覽</button>
<img id="prev" alt="行程圖片預覽">
<textarea id="out" readonly aria-label="行程文字"></textarea>

<div class="layout">
<section class="panel side">
  <div class="sidehead"><h2>景點庫</h2><span class="selrow"><select id="catFilter" aria-label="篩選分類"></select><select id="areaFilter" aria-label="篩選區域"></select></span></div>
  <div id="lib" class="dz" aria-label="景點庫"></div>
</section>

<section class="panel">
  <div class="sidehead"><h2>每日行程</h2><span class="selrow"><select id="dayW" aria-label="欄位寬度"><option value="240">欄寬：窄</option><option value="300">欄寬：標準</option><option value="380">欄寬：寬</option><option value="480">欄寬：超寬</option></select><select id="dayJump" aria-label="跳轉到某一天"></select></span></div>
  <div class="days" id="days"></div>
  <div class="row"><button id="reset">清除全部</button></div>
</section>
</div>

<div class="bottom">
<section class="panel" id="flights"><h2>班機資訊</h2><div class="legs" id="legs"></div></section>
<section class="panel" id="hotels"><h2>飯店資訊</h2><div id="hlist" class="drop dz" data-day="h"></div></section>
</div>
</main>

<script>
(function(){
  var KEY="travel-spots-v1";
  var s={title:"",spots:[],days:[[],[]]};
  var $=function(i){return document.getElementById(i)};
  var uid=function(){return Math.random().toString(36).slice(2,9)};
  var openKey=null,justDragged=false,downloads=null;
  var applyingRemote=false,cloudUser=null,cloudApi=null,deviceId="";
  var themeState={ts:0,dirty:false},IDX=null,pushTimers={},pushBusy={},pushAgain={},pushedMap={},metaTimer=null,unsubs=[];
  var viewerShare="";try{viewerShare=new URLSearchParams(location.search).get("share")||""}catch(e){}
  var viewerMode=!!viewerShare;
  function tkey(id){return KEY+"-t-"+id}
  function blankTrip(title){return {title:title||"",spots:[],days:[[],[]],flights:{out:{no:"",dep:"",arr:""},back:{no:"",dep:"",arr:""}},hotelSpots:[]}}
  function persistIdx(){if(viewerMode)return;try{localStorage.setItem(KEY+"-idx",JSON.stringify(IDX))}catch(e){}}
  function ent(id){return IDX.list.filter(function(e){return e.id===id})[0]}
  function loadTripData(id){try{var p=JSON.parse(localStorage.getItem(tkey(id))||"null");if(p&&Array.isArray(p.spots)&&Array.isArray(p.days))return p}catch(e){}return null}
  (function initIdx(){
    if(viewerMode){IDX={cur:"",uid:"",list:[],pendingDel:[]};return}
    try{
      var x=JSON.parse(localStorage.getItem(KEY+"-idx")||"null");
      if(x&&Array.isArray(x.list)&&x.list.length){
        x.list=x.list.filter(function(e){return e&&typeof e.id==="string"&&/^[A-Za-z0-9_-]+$/.test(e.id)});
        if(x.list.length){if(!x.list.some(function(e){return e.id===x.cur}))x.cur=x.list[0].id;if(!Array.isArray(x.pendingDel))x.pendingDel=[];IDX=x}
      }
    }catch(e){}
    if(!IDX){
      var old=null;try{old=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){}
      var first=(old&&Array.isArray(old.spots)&&Array.isArray(old.days))?old:blankTrip("");
      IDX={cur:"main",uid:"",pendingDel:[],list:[{id:"main",name:first.title||"",created:Date.now(),ts:0,dirty:hasData(first),ver:1,shareId:""}]};
      try{localStorage.setItem(tkey("main"),JSON.stringify(first))}catch(e){}
      persistIdx();
    }
    s=normTrip(loadTripData(IDX.cur)||blankTrip(""));
  })();
  var CATS=["住宿","景點","體驗","美食","購物"],newCat="",filterCat="",filterArea="";
  function chipBtn(c,on,attr){return '<button type="button" class="chip'+(c==="美食"?' food':'')+'" '+attr+' aria-pressed="'+on+'">'+esc(c)+'</button>'}
  function catChips(sp){
    var list=CATS.slice();if(sp.cat&&list.indexOf(sp.cat)<0)list.push(sp.cat);
    return list.map(function(c){return chipBtn(c,sp.cat===c,'data-setcat="'+esc(c)+'" data-sid="'+sp.id+'"')}).join("");
  }
  function drawChips(){$("cchips").innerHTML=CATS.map(function(c){return chipBtn(c,newCat===c,'data-newcat="'+esc(c)+'"')}).join("")}
  function esc(t){return String(t==null?"":t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
  function say(t){$("msg").textContent=t||"";if(viewerMode&&t){var v=$("vInfo");if(v)v.textContent=t}}
  function save(){if(viewerMode)return;try{localStorage.setItem(tkey(IDX.cur),JSON.stringify(s))}catch(e){say("瀏覽器儲存空間已滿，變更可能不會保留。可以刪掉幾個景點。")}markDirty()}
  function spot(id){return s.spots.filter(function(x){return x.id===id})[0]}

    if(!/(^|\.)google\./.test(h))return null;

    if(m){try{name=decodeURIComponent(m[1].replace(/\+/g," "))}catch(e){name=m[1].replace(/\+/g," ")}}

    setBadge("同步中…");
    try{
      if(id===IDX.cur)ensureTrip();else normTrip(d);
      var pm=pushedMap[id],cur={},changed=[],removed=[],keep=null;
      d.spots.forEach(function(sp){var j=JSON.stringify(sp);cur[sp.id]=j;if(!pm||pm[sp.id]!==j)changed.push(JSON.parse(j))});
      if(pm){Object.keys(pm).forEach(function(k){if(!(k in cur))removed.push(k)})}else keep=Object.keys(cur);
      var base={title:d.title||"",days:d.days.map(function(x){return {items:jclone(x)}}),hotelSpots:jclone(d.hotelSpots||[]),flights:jclone(d.flights),spotOrder:d.spots.map(function(x){return x.id}),updatedAt:ts};
      var trip=Object.assign({},base,{created:e.created||ts,shareId:e.shareId||"",device:deviceId});
      var share=null;
      if(e.shareId)share={id:e.shareId,doc:Object.assign({},base,{owner:cloudUser.uid,theme:jclone(theme)}),all:(e.shareFull||keep)?d.spots.map(jclone):null};
      await cloudApi.pushTrip(cloudUser.uid,id,trip,changed,removed,keep,share);
      pushedMap[id]=cur;e.ts=ts;e.name=d.title||"";
      if((e.ver||0)===ver)e.dirty=false;
      e.shareFull=false;persistIdx();
    }catch(err){
      pushBusy[id]=false;
      setBadge("同步失敗，稍後重試");
      try{console.error(err)}catch(_){}
      pushTimers[id]=setTimeout(function(){pushTrip(id)},15000);
      return;
    }
    pushBusy[id]=false;
    if(pushAgain[id]||e.dirty)schedulePush(id);else refreshBadge();
  }
  function scheduleMeta(){if(!cloudUser||!cloudApi)return;clearTimeout(metaTimer);metaTimer=setTimeout(pushMeta,2000)}
  async function pushMeta(){
    if(!cloudUser||!cloudApi)return;
    try{await cloudApi.setMeta(cloudUser.uid,{theme:jclone(theme),themeTs:themeState.ts||Date.now()});themeState.dirty=false;persistThemeState()}
    catch(e){clearTimeout(metaTimer);metaTimer=setTimeout(pushMeta,15000)}
  }
  function buildFromRemote(remote){
    var t=remote.trip,byId={},ordered=[];
    remote.spots.forEach(function(x){byId[x.id]=x});
    (t.spotOrder||[]).forEach(function(id){if(byId[id]){ordered.push(byId[id]);delete byId[id]}});
    Object.keys(byId).forEach(function(id){ordered.push(byId[id])});
    return normTrip(cleanData({title:t.title,spots:ordered,days:(t.days||[]).map(function(x){return (x&&x.items)||[]}),flights:t.flights,hotelSpots:t.hotelSpots}));
  }
  function applyRemoteTrip(id,remote){
    applyingRemote=true;
    try{
      var t=remote.trip,data=buildFromRemote(remote),e=ent(id),prev=tripData(id);
      if(prev&&hasData(prev)){try{localStorage.setItem(KEY+"-prev",JSON.stringify({id:id,data:prev}))}catch(_){}}
      if(!e){e={id:id,name:"",created:t.created||Date.now(),ts:0,dirty:false,shareId:""};IDX.list.push(e)}
      e.name=data.title||"";e.ts=t.updatedAt||0;e.dirty=false;e.ver=(e.ver||0);e.shareId=(typeof t.shareId==="string"&&/^[A-Za-z0-9_-]{16,64}$/.test(t.shareId))?t.shareId:"";
      if(typeof t.created==="number")e.created=t.created;
      try{localStorage.setItem(tkey(id),JSON.stringify(data))}catch(_){}
      var pm={};data.spots.forEach(function(sp){pm[sp.id]=JSON.stringify(sp)});pushedMap[id]=pm;
      persistIdx();
      if(id===IDX.cur){s=data;openKey=null;ensureTrip();render();renderTrip()}
      drawTripSel();updateShareUI();
    }finally{applyingRemote=false}
  }
  function syncErr(e){
    var c=e&&e.code||"";
    if(c==="auth/popup-closed-by-user"||c==="auth/cancelled-popup-request")return "";
    if(c==="auth/popup-blocked")return "瀏覽器擋住了登入視窗，請允許彈出視窗後再試一次。";
    if(c==="auth/unauthorized-domain")return "這個網址還沒加入 Firebase 的「已授權網域」，請到 Firebase 的 Authentication 設定新增。";
    if(c==="auth/operation-not-allowed")return "Firebase 尚未啟用 Google 登入。";
    if(c==="unavailable"||c==="firestore/unavailable")return "連不到 Firestore 資料庫。請確認 Firebase 已建立 Firestore Database、網路正常，且沒有被廣告攔截或隱私外掛擋住 firestore.googleapis.com。";
    if(c==="permission-denied"||c==="firestore/permission-denied")return "Firestore 規則不允許存取，請確認規則設定。";
    return "發生錯誤："+(c||(e&&e.message)||"未知");
  }
  function showSyncInfo(t){var el=$("syncInfo");if(el&&t)el.textContent=t}
  function nameOf(id,fallback){var e=ent(id);return (e&&e.name)||fallback||"（未命名行程）"}
  async function startSync(){
    var u=cloudUser.uid;
    if(IDX.uid&&IDX.uid!==u){IDX.list.forEach(function(e){e.ts=0;e.dirty=true;e.ver=(e.ver||0)+1;e.shareId="";e.shareFull=false});IDX.pendingDel=[];pushedMap={}}
    IDX.uid=u;persistIdx();
    setBadge("同步中…");
    try{
      await flushPendingDel();
      var meta=(await cloudApi.pullMeta(u))||{};
      var deleted=Array.isArray(meta.deleted)?meta.deleted:[];
      var ctrips=await cloudApi.listTrips(u);
      /* import data from the earlier single-trip layout on a fresh device */
      if(!ctrips.length&&!IDX.list.some(function(e){return hasData(tripData(e.id))})){
        var lg=await cloudApi.pullLegacy(u);
        if(lg&&(lg.spots.length||lg.trip.title)){
          var cid=IDX.cur,ce=ent(cid);
          applyRemoteTrip(cid,{trip:Object.assign({},lg.trip,{updatedAt:0,shareId:""}),spots:lg.spots});
          ce=ent(cid);ce.dirty=true;ce.ver=(ce.ver||0)+1;persistIdx();
        }
      }
      /* theme */
      if((meta.themeTs||0)>themeState.ts&&meta.theme){
        theme=cleanTheme(meta.theme);
        applyingRemote=true;try{saveTheme();applyTheme()}finally{applyingRemote=false}
        themeState.ts=meta.themeTs;themeState.dirty=false;persistThemeState();
      }else if(themeState.ts>(meta.themeTs||0)){pushMeta()}
      /* trips deleted on another device */
      IDX.list.map(function(e){return e.id}).forEach(function(id){if(deleted.indexOf(id)>=0&&ent(id))removeLocalTrip(id)});
      var cmap={};ctrips.forEach(function(c){if(deleted.indexOf(c.id)<0)cmap[c.id]=c});
      var ids=Object.keys(cmap);
      for(var i=0;i<ids.length;i++){
        var id=ids[i],c=cmap[id],e=ent(id),rts=c.updatedAt||0;
        if(!e){var r0=await cloudApi.pullTrip(u,id);if(r0)applyRemoteTrip(id,r0);continue}
        if(e.ts===rts){if(e.dirty)await pushTrip(id)}
        else if(rts<e.ts){e.dirty=true;persistIdx();await pushTrip(id)}
        else if(!e.dirty&&e.ts!==0){var r1=await cloudApi.pullTrip(u,id);if(r1)applyRemoteTrip(id,r1)}
        else{
          var useCloud=confirm("「"+nameOf(id,c.title)+"」在雲端和這台裝置上有不同的內容。\n\n按「確定」：使用雲端的版本（這台裝置的會被取代，但會暫存一份）。\n按「取消」：用這台裝置的版本覆蓋雲端。");
          if(useCloud){var r2=await cloudApi.pullTrip(u,id);if(r2)applyRemoteTrip(id,r2)}
          else{e.dirty=true;e.ver=(e.ver||0)+1;persistIdx();await pushTrip(id)}
        }
      }
      /* trips that only exist on this device */
      var locals=IDX.list.map(function(e){return e.id});
      for(var j=0;j<locals.length;j++){
        var lid=locals[j];
        if(cmap[lid]||deleted.indexOf(lid)>=0)continue;
        var ld=tripData(lid);
        if(!ld||!hasData(ld))continue;
        var le=ent(lid);le.dirty=true;le.ver=(le.ver||0)+1;persistIdx();
        await pushTrip(lid);
      }
      /* make sure every shared trip still has its public copy */
      for(var q=0;q<IDX.list.length;q++){
        var se=IDX.list[q];
        if(!se.shareId)continue;
        try{if(!(await cloudApi.getShare(se.shareId))){se.shareFull=true;se.dirty=true;se.ver=(se.ver||0)+1;persistIdx();await pushTrip(se.id)}}catch(err){}
      }
      drawTripSel();updateShareUI();refreshBadge();
      stopListen();
      unsubs.push(cloudApi.listenTrips(u,onTripChanges));
    }catch(e){setBadge("同步失敗");showSyncInfo(syncErr(e)||"同步失敗，請稍後再試。");try{console.error(e)}catch(_){}}
  }
  async function onTripChanges(changes){
    if(!cloudUser)return;
    for(var i=0;i<changes.length;i++){
      var ch=changes[i];
      try{
        if(ch.type==="removed"){var e0=ent(ch.id);if(e0&&!e0.dirty&&e0.ts)removeLocalTrip(ch.id);continue}
        var t=ch.data;if(!t||t.device===deviceId)continue;
        var e=ent(ch.id);
        if(e&&((t.updatedAt||0)<=e.ts||e.dirty))continue;
        var remote=await cloudApi.pullTrip(cloudUser.uid,ch.id);
        if(remote){var cur=ent(ch.id);if(!cur||(!cur.dirty&&(remote.trip.updatedAt||0)>cur.ts)){applyRemoteTrip(ch.id,remote);setBadge("已同步（已更新）")}}
      }catch(err){}
    }
  }
  function stopListen(){unsubs.forEach(function(f){try{f()}catch(e){}});unsubs=[]}
  function stopSync(){Object.keys(pushTimers).forEach(function(k){clearTimeout(pushTimers[k])});clearTimeout(metaTimer);stopListen()}

  /* sharing (read-only link) */
  function rand24(){var a=new Uint8Array(18);crypto.getRandomValues(a);return btoa(String.fromCharCode.apply(null,a)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
  function shareLink(sid){return location.origin+location.pathname+"?share="+encodeURIComponent(sid)}
  function updateShareUI(){
    var e=ent(IDX.cur),on=!!(cloudUser&&e&&e.shareId);
    $("tripShare").hidden=!cloudUser;
    $("tripShare").textContent=on?"分享中":"分享";
    $("sharebox").hidden=!on;
    if(on)$("shareUrl").value=shareLink(e.shareId);
  }
  $("tripShare").onclick=async function(){
    if(!cloudUser)return;
    var e=ent(IDX.cur);if(!e)return;
    if(e.shareId){$("sharebox").hidden=false;$("shareUrl").focus();$("shareUrl").select();return}
    e.shareId=rand24();e.shareFull=true;e.dirty=true;e.ver=(e.ver||0)+1;persistIdx();
    $("tripShare").textContent="建立中…";
    await pushTrip(IDX.cur);
    var ok=false;
    if(!e.shareFull){try{ok=!!(await cloudApi.getShare(e.shareId))}catch(err){}}
    if(!ok){e.shareId="";e.shareFull=false;e.dirty=true;e.ver=(e.ver||0)+1;persistIdx();updateShareUI();say("建立分享連結失敗，請確認 Firestore 規則已更新並按「發布」，然後再試一次。");return}
    updateShareUI();
  };
  $("shareCopy").onclick=function(){
    var inp=$("shareUrl"),btn=this;inp.select();
    var done=function(){btn.textContent="已複製";setTimeout(function(){btn.textContent="複製連結"},1800)};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(inp.value).then(done,function(){try{document.execCommand("copy");done()}catch(e){}})}
    else{try{document.execCommand("copy");done()}catch(e){}}
  };
  $("shareStop").onclick=async function(){
    var e=ent(IDX.cur);if(!e||!e.shareId||!cloudUser)return;
    if(!confirm("停止分享後，已經發出去的連結會立刻失效。確定嗎？"))return;
    try{await cloudApi.unshare(e.shareId)}catch(err){showSyncInfo(syncErr(err));return}
    e.shareId="";e.shareFull=false;e.dirty=true;e.ver=(e.ver||0)+1;persistIdx();updateShareUI();pushTrip(IDX.cur);
  };

  /* read-only viewer (?share=ID) */
  function vitem(sp,it){
    var th=sp.img?'<img class="vth" src="'+sp.img+'" alt="">':'<div class="vth"></div>';
    var tags=(sp.cat?'<span class="vtag'+(sp.cat==="美食"?' food':'')+'">'+esc(sp.cat)+'</span>':'')+(sp.area?'<span class="vtag area">'+esc(sp.area)+'</span>':'');
    return '<div class="vitem">'+th+'<div class="vbd">'+(it&&it.time?'<b class="vtime">'+esc(it.time)+'</b>':'')+(tags?'<div class="vtags">'+tags+'</div>':'')+'<div class="n">'+esc(sp.name)+'</div>'+(sp.ko?'<div class="ko">'+esc(sp.ko)+'</div>':'')+(sp.addr?'<div class="vsub">'+esc(sp.addr)+'</div>':'')+(sp.hours?'<div class="vsub">營業時間：'+esc(sp.hours)+'</div>':'')+(sp.note?'<div class="vsub">'+esc(sp.note)+'</div>':'')+(it&&it.note?'<div class="vnote">'+esc(it.note)+'</div>':'')+'<div style="margin-top:6px">'+iconHtml(sp)+'</div></div></div>';
  }
  function renderViewer(){
    ensureTrip();
    $("vTitle").textContent=s.title||"旅遊行程";
    document.title=(s.title||"旅遊行程")+"（分享）";
    var h="";
    var legs=[["out","去程"],["back","回程"]].map(function(L){var l=s.flights[L[0]];if(!(l.no||l.dep||l.arr))return "";return '<div class="vcard"><b>'+L[1]+'</b>　'+esc(l.no||"")+'<br><small>'+esc(fmtDT(l.dep))+'　→　'+esc(fmtDT(l.arr))+'</small></div>'}).join("");
    if(legs)h+='<h2>班機</h2><div class="vrow">'+legs+'</div>';
    var hs=s.hotelSpots.map(function(it){return {it:it,sp:spot(it.sid)}}).filter(function(x){return x.sp});
    if(hs.length)h+='<h2>飯店</h2><div class="vlist">'+hs.map(function(x){return vitem(x.sp,x.it)}).join("")+'</div>';
    s.days.forEach(function(d,i){
      var its=d.map(function(it){return {it:it,sp:spot(it.sid)}}).filter(function(x){return x.sp});
      h+='<h2>第 '+(i+1)+' 天</h2>'+(its.length?'<div class="vlist">'+its.map(function(x){return vitem(x.sp,x.it)}).join("")+'</div>':'<p class="hint">（尚無行程）</p>');
    });
    $("vBody").innerHTML=h;
  }
  function vFail(m){$("vTitle").textContent="找不到這份行程";$("vInfo").textContent=m||"連結可能已被停止分享，或網址不正確。";$("vBody").innerHTML="";$("vPdf").hidden=true;$("vPpt").hidden=true}
  function initViewer(){
    if(!/^[A-Za-z0-9_-]{16,64}$/.test(viewerShare)){vFail();return}
    cloudApi.getShare(viewerShare).then(function(r){
      if(!r){vFail();return}
      s=buildFromRemote(r);theme=cleanTheme(r.trip.theme);applyTheme();renderViewer();
    }).catch(function(err){vFail("無法載入（"+((err&&err.code)||"錯誤")+"），請稍後再試。")});
  }
  $("vPdf").onclick=function(){$("exPdf").click()};
  $("vPpt").onclick=function(){$("exPpt").click()};

  /* sign-in UI + startup */
  function renderSyncUI(){
    $("syncBox").hidden=false;
    var u=cloudUser;
    $("syncIn").hidden=!!u;$("syncOut").hidden=!u;
    $("syncInfo").textContent=u?("已登入："+(u.email||u.displayName||"")+"。所有行程會自動同步到登入同一帳號的其他裝置。"):"登入後，行程會自動同步到你的其他裝置。未登入時，資料只存在這台裝置。";
    if(!u)setBadge("未登入");
  }
  function initCloud(){
    if(cloudApi||!window.cloud)return;
    cloudApi=window.cloud;
    if(viewerMode){initViewer();return}
    $("syncIn").onclick=async function(){try{await cloudApi.signIn()}catch(e){showSyncInfo(syncErr(e))}};
    $("syncOut").onclick=async function(){try{await cloudApi.signOut()}catch(e){}};
    cloudApi.onAuth(function(user){
      cloudUser=user;renderSyncUI();updateShareUI();
      if(user)startSync();else stopSync();
    });
    document.addEventListener("visibilitychange",function(){if(document.hidden&&cloudUser)IDX.list.forEach(function(e){if(e.dirty)pushTrip(e.id)})});
    window.addEventListener("online",function(){if(cloudUser)IDX.list.forEach(function(e){if(e.dirty)schedulePush(e.id)})});
  }
  if(viewerMode){
    document.body.classList.add("viewer");$("viewer").hidden=false;$("vTitle").textContent="載入中…";
    setTimeout(function(){if(!cloudApi)vFail("無法連線到雲端。")},10000);
  }
  window.addEventListener("cloud-ready",initCloud);
  if(window.cloud)initCloud();
  drawChips();
  if(viewerMode){applyTheme()}else{drawTripSel();updateShareUI();render()}
})();
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
import { initializeFirestore, doc, getDoc, setDoc, deleteDoc, collection, getDocs, writeBatch, onSnapshot, arrayUnion } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDOyFkCSTcjRmeodaS-O3w-WKkWfsaJ3ls",
  authDomain: "hthsieh-7b870.firebaseapp.com",
  projectId: "hthsieh-7b870",
  storageBucket: "hthsieh-7b870.firebasestorage.app",
  messagingSenderId: "537319375553",
  appId: "1:537319375553:web:4fabfc4ee2259776048a40"
};

try {
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = initializeFirestore(app, { experimentalAutoDetectLongPolling: true });
  const metaRef = (uid) => doc(db, "users", uid, "meta", "main");
  const tripsCol = (uid) => collection(db, "users", uid, "trips");
  const tripRef = (uid, id) => doc(db, "users", uid, "trips", id);
  const tSpots = (uid, id) => collection(db, "users", uid, "trips", id, "spots");
  const tSpot = (uid, id, sid) => doc(db, "users", uid, "trips", id, "spots", sid);
  const shareRef = (sid) => doc(db, "shares", sid);
  const sSpots = (sid) => collection(db, "shares", sid, "spots");
  const sSpot = (sid, id) => doc(db, "shares", sid, "spots", id);

  async function runOps(ops) {
    for (let i = 0; i < ops.length; i += 450) {
      const b = writeBatch(db);
      ops.slice(i, i + 450).forEach((f) => f(b));
      await b.commit();
    }
  }
  async function clearCol(col) {
    const qs = await getDocs(col);
    await runOps(qs.docs.map((d) => (b) => b.delete(d.ref)));
  }

  window.cloud = {
    onAuth(cb) { return onAuthStateChanged(auth, (u) => cb(u ? { uid: u.uid, email: u.email, displayName: u.displayName } : null)); },
    signIn() { return signInWithPopup(auth, new GoogleAuthProvider()); },
    signOut() { return signOut(auth); },
    async pullMeta(uid) { const m = await getDoc(metaRef(uid)); return m.exists() ? m.data() : null; },
    async setMeta(uid, data) { await setDoc(metaRef(uid), data, { merge: true }); },
    async listTrips(uid) { const qs = await getDocs(tripsCol(uid)); return qs.docs.map((d) => ({ ...d.data(), id: d.id })); },
    async pullTrip(uid, id) {
      const t = await getDoc(tripRef(uid, id));
      if (!t.exists()) return null;
      const qs = await getDocs(tSpots(uid, id));
      return { trip: t.data(), spots: qs.docs.map((d) => ({ ...d.data(), id: d.id })) };
    },
    async pullLegacy(uid) {
      const t = await getDoc(doc(db, "users", uid, "trip", "main"));
      if (!t.exists()) return null;
      const qs = await getDocs(collection(db, "users", uid, "spots"));
      return { trip: t.data(), spots: qs.docs.map((d) => ({ ...d.data(), id: d.id })) };
    },
    async pushTrip(uid, id, trip, changed, removed, keep, share) {
      if (share) {
        await setDoc(shareRef(share.id), share.doc);
      }
      const ops = [];
      changed.forEach((sp) => ops.push((b) => b.set(tSpot(uid, id, sp.id), sp)));
      removed.forEach((sid) => ops.push((b) => b.delete(tSpot(uid, id, sid))));
      if (keep) {
        const qs = await getDocs(tSpots(uid, id));
        const ks = new Set(keep);
        qs.docs.forEach((d) => { if (!ks.has(d.id)) ops.push((b) => b.delete(d.ref)); });
      }
      if (share) {
        if (share.all) {
          const qs = await getDocs(sSpots(share.id));
          const ks = new Set(share.all.map((x) => x.id));
          qs.docs.forEach((d) => { if (!ks.has(d.id)) ops.push((b) => b.delete(d.ref)); });
          share.all.forEach((sp) => ops.push((b) => b.set(sSpot(share.id, sp.id), sp)));
        } else {
          changed.forEach((sp) => ops.push((b) => b.set(sSpot(share.id, sp.id), sp)));
          removed.forEach((sid) => ops.push((b) => b.delete(sSpot(share.id, sid))));
        }
      }
      await runOps(ops);
      await setDoc(tripRef(uid, id), trip);
    },
    async deleteTrip(uid, id, sid) {
      await setDoc(metaRef(uid), { deleted: arrayUnion(id) }, { merge: true });
      if (sid) { try { await this.unshare(sid); } catch (e) {} }
      await clearCol(tSpots(uid, id));
      await deleteDoc(tripRef(uid, id));
    },
    async unshare(sid) {
      await clearCol(sSpots(sid));
      await deleteDoc(shareRef(sid));
    },
    async getShare(sid) {
      const t = await getDoc(shareRef(sid));
      if (!t.exists()) return null;
      const qs = await getDocs(sSpots(sid));
      return { trip: t.data(), spots: qs.docs.map((d) => ({ ...d.data(), id: d.id })) };
    },
    listenTrips(uid, cb) {
      return onSnapshot(tripsCol(uid), (snap) => cb(snap.docChanges().map((c) => ({ type: c.type, id: c.doc.id, data: c.doc.data() }))), () => {});
    }
  };
  window.dispatchEvent(new Event("cloud-ready"));
} catch (e) {
  console.error("Firebase init failed", e);
}
</script>
