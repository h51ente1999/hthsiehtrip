.itime{align-self:flex-start;width:auto;background:transparent;border:0;color:var(--muted);font:inherit;font-size:.82rem;padding:2px 0}

.drop .empty{color:var(--muted);font-size:.85rem;margin:auto;text-align:center}
@keyframes sbspin{to{transform:rotate(-360deg)}}
.sbi{display:block}.sbi.spin{animation:sbspin 1s linear infinite}.syncbadge{display:inline-flex;align-items:center}
#shareStop{padding:3px 10px;font-size:.78rem;line-height:1.4;width:auto;flex:0 0 auto;border-radius:999px}
#dropLine{position:fixed;z-index:49;height:4px;border-radius:2px;background:var(--hit);pointer-events:none;display:none;box-shadow:0 0 0 2px var(--blue-soft)}
.ghost{position:fixed;z-index:50;pointer-events:none;opacity:.92;box-shadow:0 8px 20px rgba(13,42,82,.3)}
.blk.src{opacity:.35}
.addday{flex:0 0 auto;align-self:stretch;min-width:90px;border-style:solid;color:var(--muted);background:transparent}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.exrow{margin:0 0 18px}
.exrow button.primary{background:var(--surface);color:var(--accent-text);border-color:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.12)}
#out{display:none;width:100%;min-height:150px;margin-top:10px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit}
#prev{display:none;max-width:100%;max-height:60vh;object-fit:contain;margin-top:12px;border-radius:10px;border:1px solid var(--line)}
#msg{color:var(--muted);font-size:.85rem;margin:8px 0 0}
@media (max-width:640px){#lib .blk{width:100%}.day{flex-basis:min(var(--dayw,300px),86vw)}}
/* lively */
:root{--pop:cubic-bezier(.34,1.56,.64,1)}
body{font-family:"Huninn","Noto Serif TC",sans-serif!important;
 background:radial-gradient(circle at 12% 8%,color-mix(in srgb,var(--blue) 22%,transparent) 0,transparent 38%),radial-gradient(circle at 90% 20%,color-mix(in srgb,var(--tag-food) 30%,transparent) 0,transparent 36%),radial-gradient(circle at 50% 100%,color-mix(in srgb,var(--blue) 16%,transparent) 0,transparent 40%),var(--page)!important;background-attachment:fixed!important}
button,input,select,textarea{font-family:inherit}
.panel,.vwrap>.vhead{border-radius:22px!important;box-shadow:0 6px 0 color-mix(in srgb,var(--blue) 18%,transparent),0 10px 24px rgba(30,42,74,.08)!important;border:2px solid color-mix(in srgb,var(--blue) 25%,#fff)!important}
.blk{border-radius:16px!important;transition:transform .25s var(--pop),box-shadow .25s}
.blk:hover{transform:translateY(-3px);box-shadow:0 8px 16px rgba(30,42,74,.14)}
.blk:active{transform:scale(.97)}
.tag{border-radius:999px!important;padding:2px 10px!important}
.th{transition:transform .3s var(--pop)}.blk:hover .th{transform:scale(1.08)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
/* share page polish */
#viewer .vhead{background:linear-gradient(160deg,var(--blue),color-mix(in srgb,var(--blue) 55%,#1f3340));color:#fff;border-radius:22px;padding:22px 20px 26px;align-items:flex-start;margin-bottom:12px}
#viewer .vhl{flex:1;min-width:0}
#viewer .vhead h1{background:none!important;color:#fff!important;padding:0!important;margin:0 0 8px!important;font-size:1.7rem}
#vMeta{display:flex;gap:6px;flex-wrap:wrap}.vchip{background:rgba(255,255,255,.2);border-radius:999px;padding:3px 12px;font-size:.85rem}
#viewer #vCd{background:#fff;color:var(--blue);border-radius:16px;padding:8px 14px;white-space:normal;text-align:center;align-self:flex-start;font-size:.95rem}
#vTabs{position:sticky;top:0;z-index:5;display:flex;gap:6px;overflow-x:auto;padding:8px 2px;margin:0 0 6px;background:var(--page);scrollbar-width:none}
#vTabs[hidden]{display:none}#vTabs::-webkit-scrollbar{display:none}
.vtab{flex:none;border:0;border-radius:999px;padding:5px 14px;background:rgba(255,255,255,.7);color:var(--ink);font:inherit;font-size:.9rem;cursor:pointer}.vtab.on{background:var(--blue);color:var(--on-blue,#fff)}
#viewer h2.vday small.vdt{margin-left:10px;font-weight:400;font-size:.85rem;opacity:.65}.vcnt{display:flex;align-items:center;font-size:.85rem;font-weight:400;opacity:.8;gap:6px}
.vlist.vtl{position:relative;padding-left:18px}
.vlist.vtl::before{content:"";position:absolute;left:5px;top:12px;bottom:12px;width:2px;background:color-mix(in srgb,var(--blue) 40%,transparent);border-radius:2px}
.vtl>.vitem{position:relative;border-left:5px solid var(--tag-bg)}.vtl>.vitem.food{border-left-color:var(--tag-food)}
.vtl>.vitem::before{content:"";position:absolute;left:-23px;top:20px;width:10px;height:10px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 3px var(--page)}
.vtl>.vgo{border:1px dashed color-mix(in srgb,var(--blue) 50%,#fff);border-radius:999px;margin:0 0 0 6px;padding:1px 12px;font-size:.78rem;background:rgba(255,255,255,.75)}
#toTop{position:fixed;right:16px;bottom:18px;z-index:60;width:46px;height:46px;border-radius:50%;border:0;padding:0;display:grid;place-items:center;background:var(--blue);color:var(--on-blue,#fff);box-shadow:0 6px 16px rgba(0,0,0,.25);cursor:pointer;opacity:0;transform:translateY(12px) scale(.9);pointer-events:none;transition:opacity .2s,transform .2s}
#toTop.show{opacity:1;transform:none;pointer-events:auto}#toTop:hover{filter:brightness(1.1)}#toTop:active{transform:scale(.92)}
@media(prefers-reduced-motion:reduce){#toTop{transition:none}}
</style>
</head>

  function okNaver(u){try{var x=new URL(u);if((x.protocol==="https:"||x.protocol==="http:")&&/(^|\.)naver\.(com|me)$/.test(x.hostname))return x.href}catch(e){}return ""}
  function naverUrl(sp){return sp.naver||(sp.ko?"https://map.naver.com/p/search/"+encodeURIComponent(sp.ko):"")}
  function mapLinks(sp){var a=[],nu=naverUrl(sp);if(nu)a.push({u:nu,i:ICON_N,t:"Naver 地圖"});a.push({u:mapUrl(sp),i:ICON_G,t:"Google 地圖"});return a}

  function mapUrl(sp){if(sp.url)return sp.url;return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(sp.addr||sp.name)}

  if(window.claude&&claude.use){claude.use("downloads").then(function(d){downloads=d}).catch(function(){})}

  function blk(sp,inst,day,inLib,forceOpen){
    var key=inst||sp.id,open=forceOpen||openKey===key;
    var th=sp.img?'<img class="th" src="'+sp.img+'" alt="">':'<div class="th">📍</div>';
    var at=' data-sid="'+sp.id+'"';
    var d=open?'<div class="d">'+
      '<div class="chips" role="group" aria-label="分類">'+catChips(sp)+'</div>'+
      '<label class="lf"><span>區域</span><input type="text" data-f="area"'+at+' value="'+esc(sp.area)+'" aria-label="區域"></label>'+(areaList().length?'<div class="chips" role="group" aria-label="既有區域">'+areaChips(sp)+'</div>':'')+
      '<div class="lf"><span>景點名稱</span><input type="text" data-f="name"'+at+' value="'+esc(sp.name)+'" aria-label="景點名稱"><input type="text" data-f="ko"'+at+' lang="ko" value="'+esc(sp.ko)+'" placeholder="韓文店名" aria-label="韓文店名" style="margin-top:4px"></div>'+
      '<label class="lf"><span>地址</span><input type="text" data-f="addr"'+at+' value="'+esc(sp.addr)+'" aria-label="地址"></label>'+
      '<label class="lf"><span>營業時間</span><input type="text" data-f="hours"'+at+' value="'+esc(sp.hours)+'" aria-label="營業時間"></label>'+
      '<label class="lf"><span>備註</span><textarea class="f" data-f="note"'+at+' rows="3" aria-label="備註">'+esc(sp.note)+'</textarea></label>'+
      '<label class="lf"><span>Naver 地圖連結</span><input type="text" data-f="naver"'+at+' value="'+esc(sp.naver||"")+'" aria-label="Naver 地圖連結"></label>'+
      '<label class="upload"><input type="file" accept="image/*" data-img="1"'+at+'><span>'+(sp.img?'更換圖片（或直接貼上）':'上傳圖片（或直接貼上）')+'</span></label>'+iconHtml(sp)+
      (day==="h"?'<button type="button" data-rmh="'+inst+'">移出飯店資訊</button>':'')+(inst&&day!=="h"&&day!=="k"&&!inLib?'<button type="button" data-rmstop="'+inst+'">移出行程</button>':'')+(day==="k"?'<button type="button" data-rmkid="'+inst+'">移出內含</button>':'')+(inLib?'<button data-del="'+sp.id+'">刪除景點</button>':'')+'</div>':'';
    return '<div class="blk'+(open?' open':'')+'" tabindex="0" data-key="'+key+'" data-sid="'+sp.id+'"'+(inst?' data-uid="'+inst+'" data-day="'+day+'"':'')+'>'+(open?'<button type="button" class="dlcard" data-card="'+sp.id+'" title="下載圖卡" aria-label="下載圖卡">'+DLSVG+'</button>':'')+
      th+'<div class="bd">'+((sp.cat||sp.area)?'<div class="tags">'+(sp.cat?'<span class="tag'+(sp.cat==="美食"?' food':'')+'">'+esc(sp.cat)+'</span>':'')+(sp.area?'<span class="tag area">'+esc(sp.area)+'</span>':'')+'</div>':'')+'<div class="n">'+esc(sp.name)+'</div>'+(sp.ko?'<div class="ko" lang="ko">'+esc(sp.ko)+'</div>':'')+d+'</div></div>';
  }

  function render(){
    updateCountdown();
    $("title").value=s.title||"";
    var shown=s.spots.filter(function(sp){return (!filterCat||(filterCat==="__none"?!sp.cat:sp.cat===filterCat))&&(!filterArea||(filterArea==="__none"?!sp.area:sp.area===filterArea))});
    $("lib").innerHTML=shown.length?shown.map(function(sp){return blk(sp,null,null,true)}).join(""):'<p class="hint" style="margin:8px">'+(s.spots.length?'沒有符合篩選條件的景點。':'還沒有景點。複製 Google 地圖連結後按「貼上連結」，或按「手動輸入」，再把景點拖到每天的行程；點一下景點可編輯地址與備註，手機請長按再拖曳。')+'</p>';
    drawFilter();drawJump();renderHotels();
    var keepSL=$("days").scrollLeft;
    $("days").innerHTML=s.days.map(function(d,i){
      var vl=validItems(d),cr=calcDay(vl);
      var items=vl.map(function(it,k){return slotHtml(it,k,cr[k],i)}).join("");
      return '<div class="day"><header><b>第 '+(i+1)+' 天</b><span>'+d.length+' 站</span>'+(s.days.length>1?'<button data-delday="'+i+'" aria-label="刪除第 '+(i+1)+' 天">✕</button>':'')+'</header>'+
        '<div class="drop dz" data-day="'+i+'">'+(items||'<div class="empty">拖曳景點到這裡</div>')+'</div></div>';
    }).join("")+'<button class="addday" id="addday">＋ 新增一天</button>';
    $("days").scrollLeft=keepSL;
    applyView();
    growNotes();
  }

  $("title").oninput=function(){s.title=this.value;var e=ent(IDX.cur);if(e)e.name=s.title;save();drawTripSel()};

  var img="";
  $("f").onchange=function(){
    var file=this.files&&this.files[0];if(!file)return;
    var rd=new FileReader();
    rd.onload=function(){
      var im=new Image();
      im.onload=function(){
        var m=240,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");
        c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
        c.getContext("2d").drawImage(im,0,0,c.width,c.height);
        img=c.toDataURL("image/jpeg",0.72);
        $("upl").innerHTML='<img src="'+img+'" alt=""> 已選圖片';
      };
      im.src=rd.result;
    };
    rd.readAsDataURL(file);
  };

    var n=$("n").value.trim();if(!n)return;

  };

      save();render();return;
    }

        if(remote){var cur=ent(ch.id);if(!cur||(!cur.dirty&&(remote.trip.updatedAt||0)>cur.ts)){applyRemoteTrip(ch.id,remote);setBadge("已同步（已更新）")}}
      }catch(err){}
    }
  }
  function stopListen(){unsubs.forEach(function(f){try{f()}catch(e){}});unsubs=[]}
  function stopSync(){Object.keys(pushTimers).forEach(function(k){clearTimeout(pushTimers[k])});clearTimeout(metaTimer);stopListen()}

  /* sharing (read-only link) */
  function rand24(){var a=new Uint8Array(18);crypto.getRandomValues(a);return btoa(String.fromCharCode.apply(null,a)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
  function shareLink(sid){return location.origin+location.pathname+"?share="+encodeURIComponent(sid)}
  function updateShareUI(){
    var e=ent(IDX.cur),on=!!(cloudUser&&e&&e.shareId);
    $("tripShare").hidden=!cloudUser;
    $("tripShare").classList.toggle("on",on);
    $("tripShare").title=on?"分享中：點一下複製連結":"分享：複製唯讀連結";
    $("shareStopRow").hidden=!on;
  }
  function copyLink(url,msg){
    var ok=function(){say(msg)};
    var fb=function(){var t=document.createElement("textarea");t.value=url;t.style.position="fixed";t.style.opacity="0";document.body.appendChild(t);t.select();var good=false;try{good=document.execCommand("copy")}catch(_){}t.remove();if(good)ok();else window.prompt("請複製這個分享連結：",url)};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(url).then(ok,fb)}else fb();
  }
  $("tripShare").onclick=async function(){
    if(!cloudUser)return;
    var e=ent(IDX.cur);if(!e)return;
    if(e.shareId){copyLink(shareLink(e.shareId),"分享連結已複製。");return}
    e.shareId=rand24();e.shareFull=true;e.dirty=true;e.ver=(e.ver||0)+1;persistIdx();
    say("正在建立分享連結…");$("tripShare").disabled=true;
    await pushTrip(IDX.cur);
    var ok=false;
    if(!e.shareFull){try{ok=!!(await cloudApi.getShare(e.shareId))}catch(err){}}
    $("tripShare").disabled=false;
    if(!ok){e.shareId="";e.shareFull=false;e.dirty=true;e.ver=(e.ver||0)+1;persistIdx();updateShareUI();say("建立分享連結失敗，請確認 Firestore 規則已更新並按「發布」，然後再試一次。");return}
    updateShareUI();
    copyLink(shareLink(e.shareId),"已建立分享連結並複製。");
  };
  $("shareStop").onclick=async function(){
    var e=ent(IDX.cur);if(!e||!e.shareId||!cloudUser)return;
    if(!confirm("停止分享後，已經發出去的連結會立刻失效。確定嗎？"))return;
    try{await cloudApi.unshare(e.shareId)}catch(err){showSyncInfo(syncErr(err));return}
    e.shareId="";e.shareFull=false;e.dirty=true;e.ver=(e.ver||0)+1;persistIdx();updateShareUI();pushTrip(IDX.cur);say("已停止分享。");
  };

  /* read-only viewer (?share=ID) */
  function vitem(sp,it,r){
    var rg=r?rangeStr(r,"–"):(it&&it.time?it.time:"");
    var th='<div class="vside">'+(sp.img?'<img class="vth" src="'+sp.img+'" alt="">':'<div class="vth"></div>')+(rg?'<b class="vtime'+(it&&it.fixed?' vfix':'')+'">'+esc(rg)+'</b>':'')+'</div>';
    var kn=it?kidNames(it):[];
    var tags=(sp.cat?'<span class="vtag'+(sp.cat==="美食"?' food':'')+'">'+esc(sp.cat)+'</span>':'')+(sp.area?'<span class="vtag area">'+esc(sp.area)+'</span>':'');
    return '<div class="vitem'+(sp.cat==="美食"?' food':'')+'">'+th+'<div class="vbd">'+(tags?'<div class="vtags">'+tags+'</div>':'')+'<div class="n">'+esc(sp.name)+'</div>'+(sp.ko?'<div class="ko">'+esc(sp.ko)+'</div>':'')+(sp.addr?'<div class="vsub">'+esc(sp.addr)+'</div>':'')+(sp.hours?'<div class="vsub">營業時間：'+esc(sp.hours)+'</div>':'')+(sp.note?'<div class="vsub">'+esc(sp.note)+'</div>':'')+(kn.length?'<div class="vkids"><b>包含</b>'+kidList(it).map(function(x){return '<span>'+(x.img?'<img src="'+x.img+'" alt="">':'<i></i>')+esc(x.name)+iconHtml(x)+'</span>'}).join("")+'</div>':'')+(it&&it.note?'<div class="vnote">'+esc(it.note)+'</div>':'')+'<div style="margin-top:6px">'+iconHtml(sp)+'</div></div></div>';
  }
  var vCollapsed={};
  function renderViewer(){
    ensureTrip();
    var cdx=cdText(s);$("vTitle").textContent=s.title||"旅遊行程";$("vCd").textContent=cdx;$("vCd").hidden=!cdx;
    document.title=s.title||"旅遊行程";
    var h="";
    var legs=[["out","去程"],["back","回程"]].map(function(L){var l=s.flights[L[0]];if(!(l.no||l.dep||l.arr))return "";return '<div class="vcard"><b>'+L[1]+'</b>　'+esc(l.no||"")+'<br><small>'+esc(fmtDT(l.dep))+'　→　'+esc(fmtDT(l.arr))+'</small></div>'}).join("");
    if(legs)h+='<h2>班機</h2><div class="vrow">'+legs+'</div>';
    var hs=s.hotelSpots.map(function(it){return {it:it,sp:spot(it.sid)}}).filter(function(x){return x.sp});
    if(hs.length)h+='<h2>飯店</h2><div class="vlist">'+hs.map(function(x){return vitem(x.sp,x.it)}).join("")+'</div>';
    s.days.forEach(function(d,i){
      var vl=validItems(d),cr=calcDay(vl);
      var cl=vCollapsed[i]?' collapsed':'';
      h+='<h2 class="vday'+cl+'" data-vday="'+i+'" role="button" tabindex="0" aria-expanded="'+(!vCollapsed[i])+'"><span>第 '+(i+1)+' 天'+(function(){var dt=dayDate(i);return dt?'<small class="vdt">'+("0"+(dt.getMonth()+1)).slice(-2)+"/"+("0"+dt.getDate()).slice(-2)+"（週"+WDN[dt.getDay()]+"）</small>":""})()+'</span><span class="vcnt">'+vl.length+' 站<span class="vchev" aria-hidden="true"></span></span></h2>'+(vl.length?'<div class="vlist vtl'+cl+'">'+vl.map(function(it,q){return (cr[q].drive!=null?'<div class="vgo">車程 '+cr[q].drive+' 分'+'</div>':'')+vitem(spot(it.sid),it,cr[q])}).join("")+'</div>':'<p class="hint'+cl+'">（尚無行程）</p>');
    });
    $("vBody").innerHTML=h;
    drawVMeta();
  }
  var WDN="日一二三四五六";
  function dayDate(i){var v=(s.flights.out.dep||"").slice(0,10);if(!/^\d{4}-\d\d-\d\d$/.test(v))return null;var p=v.split("-");return new Date(Number(p[0]),Number(p[1])-1,Number(p[2])+i)}
  function drawVMeta(){
    var n=s.days.length,cnt=s.days.reduce(function(a,d){return a+validItems(d).length},0);
    var d1=dayDate(0),d2=dayDate(n-1);
    function f(d){return d.getFullYear()+"/"+("0"+(d.getMonth()+1)).slice(-2)+"/"+("0"+d.getDate()).slice(-2)}
    var chips=[];if(d1&&n)chips.push(f(d1)+(n>1?" – "+f(d2):""));chips.push(n+" 天");chips.push(cnt+" 個行程");
    $("vMeta").innerHTML=chips.map(function(c){return '<span class="vchip">'+esc(c)+'</span>'}).join("");
    var tb=$("vTabs");
    if(n>1){tb.hidden=false;tb.innerHTML=s.days.map(function(d,i){return '<button type="button" class="vtab" data-vtab="'+i+'">第 '+(i+1)+' 天</button>'}).join("");vSpy()}else{tb.hidden=true;tb.innerHTML=""}
  }
  function vSpy(){
    var hs=document.querySelectorAll("#vBody .vday"),cur=-1,y=window.innerHeight*0.3;
    [].forEach.call(hs,function(h,i){if(h.getBoundingClientRect().top<=y)cur=i});
    [].forEach.call(document.querySelectorAll("#vTabs .vtab"),function(b,i){b.classList.toggle("on",i===Math.max(cur,0))});
  }
  window.addEventListener("scroll",function(){if(viewerMode)vSpy()},{passive:true});
  $("vTabs").addEventListener("click",function(e){
    var b=e.target.closest(".vtab");if(!b)return;
    var h=document.querySelector('#vBody .vday[data-vday="'+b.dataset.vtab+'"]');if(!h)return;
    if(h.classList.contains("collapsed"))vToggle(h);
    var off=($("vTabs").offsetHeight||0)+8;
    window.scrollTo({top:h.getBoundingClientRect().top+window.pageYOffset-off,behavior:"smooth"});
  });
  function vToggle(h){
    var i=h.dataset.vday,c=!vCollapsed[i];vCollapsed[i]=c;
    h.classList.toggle("collapsed",c);h.setAttribute("aria-expanded",String(!c));
    var n=h.nextElementSibling;if(n)n.classList.toggle("collapsed",c);
  }
  $("vBody").addEventListener("click",function(e){var h=e.target.closest(".vday");if(h)vToggle(h)});
  $("vBody").addEventListener("keydown",function(e){if(e.key!=="Enter"&&e.key!==" ")return;var h=e.target.closest(".vday");if(h){e.preventDefault();vToggle(h)}});
  function vFail(m){$("vCd").hidden=true;$("vTitle").textContent="找不到這份行程";$("vInfo").textContent=m||"連結可能已被停止分享，或網址不正確。";$("vBody").innerHTML="";$("vPdf").hidden=true;$("vPpt").hidden=true}
  function initViewer(){
    if(!/^[A-Za-z0-9_-]{16,64}$/.test(viewerShare)){vFail();return}
    cloudApi.getShare(viewerShare).then(function(r){
      if(!r){vFail();return}
      s=buildFromRemote(r);theme=cleanTheme(r.trip.theme);applyTheme();renderViewer();
    }).catch(function(err){vFail("無法載入（"+((err&&err.code)||"錯誤")+"），請稍後再試。")});
  }
  $("vPdf").onclick=function(){$("exPdf").click()};
  $("vPpt").onclick=function(){$("exPpt").click()};

  /* sign-in UI + startup */
  function renderSyncUI(){
    $("syncBox").hidden=false;
    var u=cloudUser;
    $("syncIn").hidden=!!u;$("syncOut").hidden=!u;
    $("syncInfo").textContent=u?("已登入："+(u.email||u.displayName||"")+"。所有行程會自動同步到登入同一帳號的其他裝置。"):"登入後，行程會自動同步到你的其他裝置。未登入時，資料只存在這台裝置。";
    if(!u)setBadge("未登入");
  }
  function initCloud(){
    if(cloudApi||!window.cloud)return;
    cloudApi=window.cloud;
    if(viewerMode){initViewer();return}
    $("syncIn").onclick=async function(){try{await cloudApi.signIn()}catch(e){showSyncInfo(syncErr(e))}};
    $("syncOut").onclick=async function(){try{await cloudApi.signOut()}catch(e){}};
    cloudApi.onAuth(function(user){
      cloudUser=user;renderSyncUI();updateShareUI();
      if(user)startSync();else stopSync();
    });
    document.addEventListener("visibilitychange",function(){if(document.hidden&&cloudUser)IDX.list.forEach(function(e){if(e.dirty)pushTrip(e.id)})});
    window.addEventListener("online",function(){if(cloudUser)IDX.list.forEach(function(e){if(e.dirty)schedulePush(e.id)})});
  }
  if(viewerMode){
    document.body.classList.add("viewer");$("viewer").hidden=false;$("vTitle").textContent="載入中…";
    setTimeout(function(){if(!cloudApi)vFail("無法連線到雲端。")},10000);
  }
  window.addEventListener("cloud-ready",initCloud);
  if(window.cloud)initCloud();
  drawChips();
  if(viewerMode){applyTheme()}else{drawTripSel();updateShareUI();render()}
})();
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
import { initializeFirestore, doc, getDoc, setDoc, deleteDoc, collection, getDocs, writeBatch, onSnapshot, arrayUnion } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDOyFkCSTcjRmeodaS-O3w-WKkWfsaJ3ls",
  authDomain: "hthsieh-7b870.firebaseapp.com",
  projectId: "hthsieh-7b870",
  storageBucket: "hthsieh-7b870.firebasestorage.app",
  messagingSenderId: "537319375553",
  appId: "1:537319375553:web:4fabfc4ee2259776048a40"
};

try {
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = initializeFirestore(app, { experimentalAutoDetectLongPolling: true });
  const metaRef = (uid) => doc(db, "users", uid, "meta", "main");
  const tripsCol = (uid) => collection(db, "users", uid, "trips");
  const tripRef = (uid, id) => doc(db, "users", uid, "trips", id);
  const tSpots = (uid, id) => collection(db, "users", uid, "trips", id, "spots");
  const tSpot = (uid, id, sid) => doc(db, "users", uid, "trips", id, "spots", sid);
  const shareRef = (sid) => doc(db, "shares", sid);
  const sSpots = (sid) => collection(db, "shares", sid, "spots");
  const sSpot = (sid, id) => doc(db, "shares", sid, "spots", id);

  async function runOps(ops) {
    for (let i = 0; i < ops.length; i += 450) {
      const b = writeBatch(db);
      ops.slice(i, i + 450).forEach((f) => f(b));
      await b.commit();
    }
  }
  async function clearCol(col) {
    const qs = await getDocs(col);
    await runOps(qs.docs.map((d) => (b) => b.delete(d.ref)));
  }

  window.cloud = {
    onAuth(cb) { return onAuthStateChanged(auth, (u) => cb(u ? { uid: u.uid, email: u.email, displayName: u.displayName } : null)); },
    signIn() { return signInWithPopup(auth, new GoogleAuthProvider()); },
    signOut() { return signOut(auth); },
    async pullMeta(uid) { const m = await getDoc(metaRef(uid)); return m.exists() ? m.data() : null; },
    async setMeta(uid, data) { await setDoc(metaRef(uid), data, { merge: true }); },
    async listTrips(uid) { const qs = await getDocs(tripsCol(uid)); return qs.docs.map((d) => ({ ...d.data(), id: d.id })); },
    async pullTrip(uid, id) {
      const t = await getDoc(tripRef(uid, id));
      if (!t.exists()) return null;
      const qs = await getDocs(tSpots(uid, id));
      return { trip: t.data(), spots: qs.docs.map((d) => ({ ...d.data(), id: d.id })) };
    },
    async pullLegacy(uid) {
      const t = await getDoc(doc(db, "users", uid, "trip", "main"));
      if (!t.exists()) return null;
      const qs = await getDocs(collection(db, "users", uid, "spots"));
      return { trip: t.data(), spots: qs.docs.map((d) => ({ ...d.data(), id: d.id })) };
    },
    async pushTrip(uid, id, trip, changed, removed, keep, share) {
      if (share) {
        await setDoc(shareRef(share.id), share.doc);
      }
      const ops = [];
      changed.forEach((sp) => ops.push((b) => b.set(tSpot(uid, id, sp.id), sp)));
      removed.forEach((sid) => ops.push((b) => b.delete(tSpot(uid, id, sid))));
      if (keep) {
        const qs = await getDocs(tSpots(uid, id));
        const ks = new Set(keep);
        qs.docs.forEach((d) => { if (!ks.has(d.id)) ops.push((b) => b.delete(d.ref)); });
      }
      if (share) {
        if (share.all) {
          const qs = await getDocs(sSpots(share.id));
          const ks = new Set(share.all.map((x) => x.id));
          qs.docs.forEach((d) => { if (!ks.has(d.id)) ops.push((b) => b.delete(d.ref)); });
          share.all.forEach((sp) => ops.push((b) => b.set(sSpot(share.id, sp.id), sp)));
        } else {
          changed.forEach((sp) => ops.push((b) => b.set(sSpot(share.id, sp.id), sp)));
          removed.forEach((sid) => ops.push((b) => b.delete(sSpot(share.id, sid))));
        }
      }
      await runOps(ops);
      await setDoc(tripRef(uid, id), trip);
    },
    async deleteTrip(uid, id, sid) {
      await setDoc(metaRef(uid), { deleted: arrayUnion(id) }, { merge: true });
      if (sid) { try { await this.unshare(sid); } catch (e) {} }
      await clearCol(tSpots(uid, id));
      await deleteDoc(tripRef(uid, id));
    },
    async unshare(sid) {
      await clearCol(sSpots(sid));
      await deleteDoc(shareRef(sid));
    },
    async getShare(sid) {
      const t = await getDoc(shareRef(sid));
      if (!t.exists()) return null;
      const qs = await getDocs(sSpots(sid));
      return { trip: t.data(), spots: qs.docs.map((d) => ({ ...d.data(), id: d.id })) };
    },
    listenTrips(uid, cb) {
      return onSnapshot(tripsCol(uid), (snap) => cb(snap.docChanges().map((c) => ({ type: c.type, id: c.doc.id, data: c.doc.data() }))), () => {});
    }
  };
  window.dispatchEvent(new Event("cloud-ready"));
} catch (e) {
  console.error("Firebase init failed", e);
}
</script>
