<script>
"use strict";
var APP="travel-spots-v1",HELPER="https://hthsiehtrip.h51ente1999.workers.dev";
var MAXIMG=4,IMGMAX=1100,BUDGET=820000;
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function toast(t){var e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove("on")},2200)}
function nf(n){return Number(Math.round(n)).toLocaleString("en-US")}
var CUR={TWD:"NT$",JPY:"¥",KRW:"₩",USD:"US$",EUR:"€",CNY:"¥",HKD:"HK$",THB:"฿",SGD:"S$",GBP:"£"};
function money(p,c){if(!(p>0))return "";return (CUR[c]||(c?c+" ":""))+nf(p)}

/* ---------- 行程與帳本 ---------- */
var TRIPS=[],METAS=[],TRIP="",META=null,FILTER="all",VIEW="";
try{VIEW=(new URLSearchParams(location.search).get("view")||"").replace(/[^A-Za-z0-9_-]/g,"").slice(0,64)}catch(e){}
function readTrips(){
  try{var x=JSON.parse(localStorage.getItem(APP+"-idx")||"null");
    if(x&&Array.isArray(x.list))return x.list.filter(function(e){return e&&typeof e.id==="string"}).map(function(e){return {id:e.id,name:String(e.name||"（未命名行程）").slice(0,40),shareId:typeof e.shareId==="string"?e.shareId:""}})}catch(e){}
  return [];
}
function readLedgers(){
  return new Promise(function(res){
    try{
      var rq=indexedDB.open("split-v1",1);
      rq.onupgradeneeded=function(){try{rq.result.createObjectStore("ledgers",{keyPath:"id"})}catch(e){}};
      rq.onsuccess=function(){
        var db=rq.result;
        try{var g=db.transaction("ledgers").objectStore("ledgers").getAll();
          g.onsuccess=function(){res((g.result||[]).filter(function(L){return L&&L.id}))};
          g.onerror=function(){res([])}}catch(e){res([])}
      };
      rq.onerror=rq.onblocked=function(){res([])};
    }catch(e){res([])}
  });
}
function forTrip(tid){
  if(VIEW)return METAS.filter(function(L){return L.tripId==="s:"+VIEW});
  if(!tid)return [];
  var t=TRIPS.filter(function(x){return x.id===tid})[0];
  var tags=[tid];if(t&&t.shareId)tags.push("s:"+t.shareId);
  return METAS.filter(function(L){return tags.indexOf(L.tripId)>=0});

    var u=URL.createObjectURL(blob),im=new Image();

      var c=document.createElement("canvas");c.width=Math.max(1,Math.round(w*s));c.height=Math.max(1,Math.round(h*s));

      URL.revokeObjectURL(u);
      var q=0.74,out=c.toDataURL("image/jpeg",q);
      while(out.length>150000&&q>0.4){q-=0.08;out=c.toDataURL("image/jpeg",q)}

async function fetchInfo(){
  var u=$("eU").value.trim(),s=$("eFs");
  if(!/^https:\/\/\S+$/.test(u)){s.innerHTML='<div class="small" style="color:var(--warn)">請貼完整的 https 網址。</div>';return}
  s.innerHTML='<div class="ld"><i class="lsp"></i>讀取商品頁…</div>';
  var j=null;
  try{var r=await fetch(HELPER+"/shop?u="+encodeURIComponent(u));j=await r.json();if(!r.ok)throw 0}
  catch(e){s.innerHTML='<div class="small" style="color:var(--warn)">抓不到這一頁，可能是需要登入或擋了機器人。手動填就好。</div>';return}
  var hit=[];
  if(j.title){
    $("eT").value=j.title;hit.push("名稱");
    if(needZh(j.title)){
      s.innerHTML='<div class="ld"><i class="lsp"></i>翻成繁體中文…</div>';
      try{var zh=await toZh(j.title,j.site);

      }catch(e){}

  if(j.site&&!$("eS").value.trim()){$("eS").value=j.site}
  if(j.img&&IMGS.length<MAXIMG){
    s.innerHTML='<div class="ld"><i class="lsp"></i>下載照片…</div>';
    try{
      var ir=await fetch(HELPER+"/shopimg?u="+encodeURIComponent(j.img));
      if(ir.ok){var b=await ir.blob();var d=await shrink(b);
        if(bytesOf(IMGS)+d.length<=BUDGET){IMGS.push(d);drawThumbs();hit.push("照片")}}
    }catch(e){}

}

$("big").onclick=function(e){if(!e.target.closest||!e.target.closest(".nav"))this.classList.remove("on")};
document.addEventListener("keydown",function(e){
  var b=$("big");if(!b.classList.contains("on"))return;

(function(){

  var mo=new MutationObserver(sync);
  els().forEach(function(e){e.classList.add("modal");mo.observe(e,{attributes:true,attributeFilter:["hidden"],childList:true})});
  bk.onclick=closeAll;
  document.addEventListener("keydown",function(ev){if(ev.key==="Escape")closeAll()});
