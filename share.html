<script>
(function(){
  var KEY="travel-spots-v1";
  var s={title:"",spots:[],days:[[],[]]};
  var __dm={};var $=function(i){return document.getElementById(i)||__dm[i]||(__dm[i]=document.createElement("div"))};
  var uid=function(){return Math.random().toString(36).slice(2,9)};
  var openKey=null,justDragged=false,downloads=null;
  var acctDeleting=false,applyingRemote=false,cloudUser=null,cloudApi=null,deviceId="";
  var themeState={ts:0,dirty:false},IDX=null,pushTimers={},pushBusy={},pushAgain={},pushedMap={},metaTimer=null,unsubs=[];
  var viewerShare="";try{viewerShare=new URLSearchParams(location.search).get("share")||"-"}catch(e){}
  var viewerMode=!!viewerShare;
  function tkey(id){return KEY+"-t-"+id}
  function blankTrip(title){return {title:title||"",cur:"",spots:[],days:[[],[]],flights:{out:{no:"",dep:"",arr:""},back:{no:"",dep:"",arr:""}},hotelSpots:[]}}
  function persistIdx(){if(viewerMode)return;try{localStorage.setItem(KEY+"-idx",JSON.stringify(IDX))}catch(e){}}
  function ent(id){return IDX.list.filter(function(e){return e.id===id})[0]}
  function loadTripData(id){try{var p=JSON.parse(localStorage.getItem(tkey(id))||"null");if(p&&Array.isArray(p.spots)&&Array.isArray(p.days))return p}catch(e){}return null}
  (function initIdx(){
    if(viewerMode){IDX={cur:"",uid:"",list:[],pendingDel:[]};return}
    try{
      var x=JSON.parse(localStorage.getItem(KEY+"-idx")||"null");
      if(x&&Array.isArray(x.list)&&x.list.length){
        x.list=x.list.filter(function(e){return e&&typeof e.id==="string"&&/^[A-Za-z0-9_-]+$/.test(e.id)});
        if(x.list.length){if(!x.list.some(function(e){return e.id===x.cur}))x.cur=x.list[0].id;if(!Array.isArray(x.pendingDel))x.pendingDel=[];IDX=x}
      }
    }catch(e){}
    if(!IDX){
      var old=null;try{old=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){}
      var first=(old&&Array.isArray(old.spots)&&Array.isArray(old.days))?old:blankTrip("");
      IDX={cur:"main",uid:"",pendingDel:[],list:[{id:"main",name:first.title||"",created:Date.now(),ts:0,dirty:hasData(first),ver:1,shareId:""}]};
      try{localStorage.setItem(tkey("main"),JSON.stringify(first))}catch(e){}
      persistIdx();
    }
    s=normTrip(loadTripData(IDX.cur)||blankTrip(""));
  })();
  var CATS=["住宿","景點","體驗","美食","點心","購物"],isFoodCat=function(c){return c==="美食"||c==="點心"},newCat="",filterCat="",filterArea="";
  function chipBtn(c,on,attr){return '<button type="button" class="chip'+(isFoodCat(c)?' food':'')+'" '+attr+' aria-pressed="'+on+'">'+esc(c)+'</button>'}
  function catChips(sp){
    var list=CATS.slice();if(sp.cat&&list.indexOf(sp.cat)<0)list.push(sp.cat);
    return list.map(function(c){return chipBtn(c,sp.cat===c,'data-setcat="'+esc(c)+'" data-sid="'+sp.id+'"')}).join("");
  }
  function drawChips(){$("cchips").innerHTML=CATS.map(function(c){return chipBtn(c,newCat===c,'data-newcat="'+esc(c)+'"')}).join("")}
  function esc(t){return String(t==null?"":t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
  function t2m(v){var m=/^(\d{1,2}):(\d{2})$/.exec(v||"");return m?(+m[1])*60+(+m[2]):null}
  function m2t(n){n=((Math.round(n)%1440)+1440)%1440;return ("0"+Math.floor(n/60)).slice(-2)+":"+("0"+n%60).slice(-2)}
  function numv(v){if(v===""||v==null)return null;var n=Math.round(Number(v));return isFinite(n)&&n>=0?n:null}
  function calcDay(list){
    var out=[],prev=null;
    list.forEach(function(it,i){
      var stay=numv(it.stay),drive=numv(it.drive),man=t2m(it.time),arr=null,calc=false,late=0;
      if(i>0&&prev!=null&&drive!=null){
        var c=prev+drive;
        if(it.fixed&&man!=null){arr=man;if(c>man)late=c-man}
        else{arr=c;calc=true}
      }else arr=man;
      var leave=(arr!=null&&stay!=null)?arr+stay:null;
      out.push({arr:arr,leave:leave,calc:calc,late:late,stay:stay,drive:(i>0?drive:null)});
      prev=leave;
    });
    return out;
  }
  function rangeStr(r,sep){return r.arr==null?"":m2t(r.arr)+(r.leave!=null?(sep||" – ")+m2t(r.leave):"")}
  function kidNames(it){return (it.kids||[]).map(function(k){var sp=spot(k.sid);return sp?sp.name:""}).filter(Boolean)}
  function kidList(it){return (it.kids||[]).map(function(k){return spot(k.sid)}).filter(Boolean)}
  function noteLine(it,r,noKids,noDrive){
    var a=[];
    if(!noDrive&&r&&r.drive>0)a.push("路程 "+r.drive+" 分");
    var kn=noKids?[]:kidNames(it);if(kn.length)a.push("含："+kn.join("、"));
    var nsp=spot(it.sid);if(nsp&&nsp.note)a.push(nsp.note.replace(/\n/g," "));
    return a.join("　");
  }
  function cleanRt(x){
    if(!x||typeof x!=="object"||!Array.isArray(x.steps)||!x.steps.length)return null;
    var n=function(v,m){v=Number(v);return isFinite(v)&&v>=0&&v<=m?v:0},t=function(v,m){return String(v==null?"":v).slice(0,m)};
    var st=[];
    x.steps.slice(0,40).forEach(function(p){
      if(!p||typeof p!=="object")return;
      var o={m:p.m==="T"?"T":"W",sec:n(p.sec,86400),dm:n(p.dm,500000)};
      if(o.m==="T"){["line","ln","col","veh","vn","ag","head","from","to"].forEach(function(k){if(p[k])o[k]=t(p[k],40)});
        if(p.dep)o.dep=t(p.dep,5);if(p.arr)o.arr=t(p.arr,5);if(p.n)o.n=n(p.n,200)}
      else if(p.t)o.t=t(p.t,120);
      st.push(o);
    });
    if(!st.length)return null;
    var r={sec:n(x.sec,86400),km:n(x.km,10000),steps:st};
    if(x.dep)r.dep=t(x.dep,5);if(x.bus)r.bus=true;
    return r;
  }

    return P.write({outputType:"blob"});

  function pdfFile(pages,PWpt,PHpt){
    var enc=new TextEncoder(),chunks=[],offs=[],len=0;
    function push(x){var u=typeof x==="string"?enc.encode(x):x;chunks.push(u);len+=u.length}
    function obj(n,fn){offs[n]=len;push(n+" 0 obj\n");fn();push("\nendobj\n")}
    var n=pages.length,kids=[];
    for(var i=0;i<n;i++)kids.push((3+3*i)+" 0 R");
    push("%PDF-1.4\n");
    obj(1,function(){push("<< /Type /Catalog /Pages 2 0 R >>")});

  async function startSync(){
    var u=cloudUser.uid;
    if(IDX.uid&&IDX.uid!==u){IDX.list.forEach(function(e){e.ts=0;e.dirty=true;e.ver=(e.ver||0)+1;e.shareId="";e.shareFull=false});IDX.pendingDel=[];pushedMap={}}
    IDX.uid=u;persistIdx();
    setBadge("同步中…");
    try{
      await flushPendingDel();
      var meta=(await cloudApi.pullMeta(u))||{};
      var deleted=Array.isArray(meta.deleted)?meta.deleted:[];
      var ctrips=await cloudApi.listTrips(u);
      ctrips.forEach(function(ct){try{if(ent(ct.id))histMergeRemote(ct.id,ct.hist)}catch(_){}});
      /* import data from the earlier single-trip layout on a fresh device */
      if(!ctrips.length&&!IDX.list.some(function(e){return hasData(tripData(e.id))})){
        var lg=await cloudApi.pullLegacy(u);
        if(lg&&(lg.spots.length||lg.trip.title)){
          var cid=IDX.cur,ce=ent(cid);
          applyRemoteTrip(cid,{trip:Object.assign({},lg.trip,{updatedAt:0,shareId:""}),spots:lg.spots});
          ce=ent(cid);ce.dirty=true;ce.ver=(ce.ver||0)+1;persistIdx();
        }
      }
      /* theme */
      if((meta.themeTs||0)>themeState.ts&&meta.theme){
        theme=cleanTheme(meta.theme);
        applyingRemote=true;try{saveTheme();applyTheme()}finally{applyingRemote=false}
        themeState.ts=meta.themeTs;themeState.dirty=false;persistThemeState();
      }else if(themeState.ts>(meta.themeTs||0)){pushMeta()}

      var cmap={};ctrips.forEach(function(c){if(deleted.indexOf(c.id)<0)cmap[c.id]=c});
      var ids=Object.keys(cmap);
      for(var i=0;i<ids.length;i++){
        var id=ids[i],c=cmap[id],e=ent(id),rts=c.updatedAt||0;
        if(!e){var r0=await cloudApi.pullTrip(u,id);if(r0)applyRemoteTrip(id,r0);continue}
        if(e.ts===rts){if(e.dirty)await pushTrip(id)}
        else if(rts<e.ts){e.dirty=true;persistIdx();await pushTrip(id)}
        else if(!e.dirty&&e.ts!==0){var r1=await cloudApi.pullTrip(u,id);if(r1)applyRemoteTrip(id,r1)}

  function aiBind(){

      if(b.dataset.aistay2){var pk2=aiPicks(ai.day),id2=b.dataset.aistay2;if(id2 in pk2){pk2[id2]=Math.max(15,Math.min(480,pk2[id2]+Number(b.dataset.d)));aiRun(true)}return}
      if(b.dataset.aikidx){var kp=b.dataset.aikidx.split(":"),kd4=aiKids(ai.day),pk4=aiPicks(ai.day);if(kd4[kp[0]]){kd4[kp[0]]=kd4[kp[0]].filter(function(x){return x!==kp[1]});if(!kd4[kp[0]].length)delete kd4[kp[0]];var ks4=spot(kp[1]);if(ks4&&(kp[0] in pk4))pk4[kp[0]]=Math.max(15,pk4[kp[0]]-aiDefStay(ks4))}aiDraw();return}
      if(b.dataset.aifc!==undefined){var c1=b.dataset.aifc;if(ai.fcat[c1])delete ai.fcat[c1];else ai.fcat[c1]=1;aiDraw();return}
      if(b.dataset.aifa!==undefined){var a1=b.dataset.aifa;if(ai.farea[a1])delete ai.farea[a1];else ai.farea[a1]=1;aiDraw();return}
      if(b.dataset.aimode){ai.mode=b.dataset.aimode;aiSavePref();aiDraw();return}
      if(b.dataset.aigo){ai.msg="";aiRun();return}
      if(b.dataset.aiskip){ai.skip=true;b.disabled=true;b.textContent="改用估算中…";return}
      if(b.dataset.aiback){ai.msg="";ai.view="pick";ai.res=null;ai.seq++;aiDraw();return}
      if(b.dataset.aiapply){aiApply(Number(b.dataset.aiapply));return}
      if(b.dataset.aifix){var p=b.dataset.aifix.split(":"),pl=ai.res&&ai.res.plans[+p[0]],r=pl&&pl.rem[+p[1]],f=r&&r.fixes[+p[2]];if(f)f.act();return}
    });
    aiEl.addEventListener("change",function(e){
      var t=e.target;
      if(t.dataset.aisel){var pk=aiPicks(ai.day),sp=spot(t.dataset.aisel);if(!sp)return;if(t.checked)pk[sp.id]=aiDefStay(sp);else{delete pk[sp.id];delete aiKids(ai.day)[sp.id];if(ai.pos[ai.day])delete ai.pos[ai.day][sp.id];if(ai.meal[ai.day])delete ai.meal[ai.day][sp.id]}aiDraw();return}
      if(t.dataset.aipick){var q=t.dataset.aipick.split(":"),pl2=ai.res&&ai.res.plans[+q[0]],r2=pl2&&pl2.rem[+q[1]],o2=r2&&r2.sel&&r2.sel.opts[+t.value];if(o2)o2.act();return}
      if(t.dataset.aikid){var pk3=aiPicks(ai.day),kd3=aiKids(ai.day),par=t.dataset.aikid,kid=spot(t.value);if(kid&&(par in pk3)){(kd3[par]||(kd3[par]=[])).push(kid.id);pk3[par]=Math.min(480,pk3[par]+aiDefStay(kid))}aiDraw();return}
      if(t.dataset.aimeal){var mp=ai.meal[ai.day]||(ai.meal[ai.day]={});if(t.value)mp[t.dataset.aimeal]=t.value;else delete mp[t.dataset.aimeal];aiDraw();return}
      if(t.dataset.aipos){var pm=ai.pos[ai.day]||(ai.pos[ai.day]={}),v=parseInt(t.value,10);if(v>=1)pm[t.dataset.aipos]=v;else delete pm[t.dataset.aipos];aiDraw();return}
      if(t.id==="aiBag"){ai.bag=t.checked;aiDraw();return}if(t.id==="aiPick"){ai.pick=t.checked;aiDraw();return}if(t.id==="aiHome"){ai.home=t.checked;aiDraw();return}
      if(t.id==="aiStart"&&/^\d\d:\d\d$/.test(t.value)){ai.start=t.value;aiSavePref()}
    });
    aiEl.addEventListener("toggle",function(e){if(e.target.classList&&e.target.classList.contains("fbd"))ai.fbOpen=e.target.open},true);
    aiEl.addEventListener("input",function(e){if(e.target.id==="aiQ"){ai.filter=e.target.value;var pos=e.target.selectionStart;aiDraw();var q=document.getElementById("aiQ");if(q){q.focus();try{q.setSelectionRange(pos,pos)}catch(x){}}}});
    document.addEventListener("keydown",function(e){if(e.key==="Escape"&&aiEl&&aiEl.classList.contains("on"))aiClose()});
  }
  document.addEventListener("click",function(e){
    var b=e.target.closest&&e.target.closest("#aiBtn");
    if(b){aiOpen(ai.day<s.days.length?ai.day:0);return}
    var tb=e.target.closest&&e.target.closest("button[data-esttransit]");
    if(tb){
      tb.disabled=true;say("正在查詢大眾運輸時間（依上一站離開時間）…");
      var f=dayItems(tb.dataset.esttransit);
      if(!f||f.k===0){say("這是第一站，沒有前一站的路程。");tb.disabled=false;return}
      var it=f.vl[f.k],a=spot(f.vl[f.k-1].sid),bb=spot(it.sid);
      Promise.all([coordsOf(a),coordsOf(bb)]).then(function(c){
        if(!c[0]||!c[1]){say("找不到景點的位置，請補上地址，或用 Google／Naver 連結重新加入。");render();return}
        var cr0=calcDay(f.vl),lv=cr0[f.k-1]&&cr0[f.k-1].leave;return aiTransit(c[0],c[1],lv!=null?lv:600).then(function(r){
          if(r.min){it.drive=r.min;it.mode="transit";save();render();say("已填入大眾運輸時間"+(r.lines&&r.lines.length?"（"+r.lines.slice(0,3).join("→")+"）":"")+"，已多留 5 分鐘。")}
          else{render();say(r.err==="limit"?"本月大眾運輸查詢已達上限，請改用開車或步行估算。":r.err==="none"?"這段路找不到大眾運輸路線。":r.err==="no-helper"?"還沒設定助手網址，無法查詢。":"查詢失敗（"+(r.st||"無回應")+(r.code?" "+r.code:"")+(r.detail?"："+r.detail:"")+"），請把這行訊息回報。")}
        });
      });
    }
  });
  /* ===== 景點庫：批次匯出／匯入 ===== */
  var lb={tab:"out",sel:{},fcat:{},farea:{},img:true,imp:null,fname:"",msg:"",fb:""},lbEl=null;
  function lbNorm(v){return String(v||"").toLowerCase().replace(/[\s·・\-_,，.()（）]/g,"")}
  function lbSame(a,b){
    if(a.naver&&b.naver&&a.naver===b.naver)return true;
    if(a.url&&b.url&&a.url===b.url)return true;
    var n1=lbNorm(a.name)||lbNorm(a.ko),n2=lbNorm(b.name)||lbNorm(b.ko);
    if(n1&&n1===n2&&(!a.addr||!b.addr||lbNorm(a.addr)===lbNorm(b.addr)))return true;
    return false;
  }
  function lbClean(x){
    if(!x||typeof x!=="object"||!str(x.name).trim())return null;
    return {id:uid(),cat:str(x.cat).slice(0,20),name:str(x.name).slice(0,120),ko:str(x.ko).slice(0,120),hours:str(x.hours).slice(0,60),area:str(x.area).slice(0,30),addr:str(x.addr).slice(0,200),note:str(x.note).slice(0,2000),naver:okNaver(str(x.naver)),img:IMGRE.test(str(x.img))?x.img:"",url:okUrl(str(x.url)),phone:str(x.phone).slice(0,40)||undefined,gid:/^[A-Za-z0-9_-]{10,200}$/.test(str(x.gid))?x.gid:undefined,lat:okLL(x.lat,x.lng)?x.lat:undefined,lng:okLL(x.lat,x.lng)?x.lng:undefined};
  }
  function lbOpen(){
    if(!lbEl){lbEl=document.createElement("div");lbEl.id="lbSheet";document.body.appendChild(lbEl);lbBind()}
    lb.tab="out";lb.sel={};lb.fcat={};lb.farea={};lb.imp=null;lb.msg="";lb.fb="";
    lbEl.classList.add("on","fresh");document.documentElement.classList.add("lb-open");lbDraw();
    clearTimeout(lbEl._f);lbEl._f=setTimeout(function(){lbEl.classList.remove("fresh")},450);
  }
  function lbClose(){if(lbEl)lbEl.classList.remove("on");document.documentElement.classList.remove("lb-open")}
  function lbFilterRows(list){
    var hasC=Object.keys(lb.fcat).length>0,hasA=Object.keys(lb.farea).length>0;
    return list.filter(function(sp){return (!hasC||lb.fcat[sp.cat||"未分類"])&&(!hasA||lb.farea[sp.area||""])});
  }
  function lbChips(list){
    var cc={},ac={};list.forEach(function(sp){var c=sp.cat||"未分類";cc[c]=(cc[c]||0)+1;if(sp.area)ac[sp.area]=(ac[sp.area]||0)+1});
    var cl=CATS.filter(function(c){return cc[c]}).concat(Object.keys(cc).filter(function(c){return CATS.indexOf(c)<0}));
    var al=Object.keys(ac).sort(function(a,b){return ac[b]-ac[a]||(a<b?-1:1)});
    return '<div class="fl">'+(cl.length?'<div class="fr" role="group" aria-label="分類">'+cl.map(function(c){return '<button type="button" class="fc" data-lbfc="'+esc(c)+'" aria-pressed="'+(!!lb.fcat[c])+'">'+esc(c)+'<i>'+cc[c]+'</i></button>'}).join("")+'</div>':'')+(al.length?'<div class="fr" role="group" aria-label="區域">'+al.map(function(c){return '<button type="button" class="fc" data-lbfa="'+esc(c)+'" aria-pressed="'+(!!lb.farea[c])+'">'+esc(c)+'<i>'+ac[c]+'</i></button>'}).join("")+'</div>':'')+'</div>';
  }
  function lbRow(sp,key,on,tag){
    return '<label class="r'+(on?' on':'')+'"><span class="ck"><input type="checkbox" data-lbsel="'+esc(key)+'"'+(on?' checked':'')+'><span class="th">'+(sp.img?'<img src="'+esc(sp.img)+'" alt="">':'')+'</span><span class="nm"><b>'+esc(spotName(sp))+'</b><small>'+esc([sp.cat,sp.area].filter(Boolean).join(" · "))+(tag?(sp.cat||sp.area?" · ":"")+tag:"")+'</small></span></span></label>';
  }
  function lbDraw(){
    if(!lbEl)return;
    var h='<div class="bk" data-lbx="1"></div><div class="pn" role="dialog" aria-modal="true" aria-label="批次匯出與匯入景點"><div class="hd"><h3>批次匯出／匯入景點</h3><button type="button" class="x" data-lbx="1" aria-label="關閉">✕</button></div>';
    h+='<div class="dtabs" role="tablist"><button type="button" role="tab" aria-selected="'+(lb.tab==="out")+'" data-lbtab="out">匯出景點</button><button type="button" role="tab" aria-selected="'+(lb.tab==="in")+'" data-lbtab="in">匯入景點</button></div>';
    var scr=lbEl.querySelector(".bd"),st=scr?scr.scrollTop:0;
    if(lb.tab==="out"){
      var rows=lbFilterRows(s.spots),n=Object.keys(lb.sel).filter(function(id){return spot(id)}).length;
      h+=lbChips(s.spots)+'<div class="lbtool"><button type="button" class="mini" data-lball="1">全選目前顯示的 '+rows.length+' 個</button><button type="button" class="mini" data-lbnone="1">清除選取</button><label class="lbimg"><input type="checkbox" id="lbImg"'+(lb.img?' checked':'')+'>包含圖片</label></div>';
      h+='<div class="bd">'+(rows.length?rows.map(function(sp){return lbRow(sp,sp.id,!!lb.sel[sp.id])}).join(""):'<p class="aempty">'+(s.spots.length?'沒有符合的景點':'景點庫還沒有景點')+'</p>')+(lb.fb?'<textarea class="lbta" readonly>'+esc(lb.fb)+'</textarea>':'')+'</div>';
      h+='<div class="ft"><span>已選 <b>'+n+'</b> / '+s.spots.length+' 個'+(lb.msg?'　'+esc(lb.msg):'')+'</span><button type="button" class="aigo" data-lbexp="1"'+(n?'':' disabled')+'>匯出所選</button></div>';
    }else{
      if(!lb.imp){
        h+='<div class="bd"><div class="lbdrop"><p>選擇之前匯出的景點備份檔（.json），也可以選整份行程備份檔，只會取出裡面的景點。</p><button type="button" class="aigo" data-lbpick="1">選擇備份檔</button>'+(lb.msg?'<p class="amsg">'+esc(lb.msg)+'</p>':'')+'</div></div><div class="ft"><span>匯入的景點會加進景點庫，不會動到現有景點和行程</span></div>';
      }else{
        var rows2=lbFilterRows(lb.imp.map(function(x){return x.sp})),vis={};rows2.forEach(function(sp){vis[sp.id]=1});
        var n2=lb.imp.filter(function(x){return x.on}).length,dup=lb.imp.filter(function(x){return x.dup}).length;
        h+=lbChips(lb.imp.map(function(x){return x.sp}))+'<div class="lbtool"><button type="button" class="mini" data-lball="1">全選目前顯示的 '+rows2.length+' 個</button><button type="button" class="mini" data-lbnone="1">清除選取</button><span class="lbfn">'+esc(lb.fname)+'</span></div>';
        h+='<div class="bd">'+(rows2.length?lb.imp.filter(function(x){return vis[x.sp.id]}).map(function(x){return lbRow(x.sp,x.sp.id,x.on,x.dup?"景點庫已有類似的":"")}).join(""):'<p class="aempty">沒有符合的景點</p>')+'</div>';
        h+='<div class="ft"><span>已選 <b>'+n2+'</b> / '+lb.imp.length+' 個'+(dup?'　（'+dup+' 個已有類似的，預設不選）':'')+'</span><span class="lbbtns"><button type="button" class="mini" data-lbpick="1">換一個檔案</button><button type="button" class="aigo" data-lbimp="1"'+(n2?'':' disabled')+'>匯入所選</button></span></div>';
      }
    }
    h+='</div>';
    lbEl.innerHTML=h;
    var s2=lbEl.querySelector(".bd");if(s2)s2.scrollTop=st;
  }
  async function lbExport(){
    var ids=Object.keys(lb.sel).filter(function(id){return lb.sel[id]&&spot(id)});if(!ids.length)return;
    var list=s.spots.filter(function(sp){return lb.sel[sp.id]}).map(function(sp){
      var o={id:sp.id,cat:sp.cat||"",name:sp.name||"",ko:sp.ko||"",hours:sp.hours||"",area:sp.area||"",addr:sp.addr||"",note:sp.note||"",naver:sp.naver||"",url:sp.url||""};
      if(lb.img&&sp.img)o.img=sp.img;if(okLL(sp.lat,sp.lng)){o.lat=sp.lat;o.lng=sp.lng}return o;
    });
    var json=JSON.stringify({app:"travel-spots-library",version:1,exportedAt:new Date().toISOString(),spots:list});
    var d=new Date(),ds=d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);
    var r=await saveBlob(new Blob([json],{type:"application/json"}),"景點庫-"+list.length+"個景點-"+ds+".json");
    if(r==="ok"){lb.msg="已匯出 "+list.length+" 個";lb.fb=""}
    else if(r==="cancel"){lb.msg="已取消"}
    else{lb.msg="無法直接下載，請複製下方內容存成 .json 檔";lb.fb=json}
    lbDraw();
  }
  function lbRead(file){
    file.text().then(function(txt){
      var o;try{o=JSON.parse(txt)}catch(e){lb.msg="這不是有效的備份檔。";lb.imp=null;lbDraw();return}
      var arr=Array.isArray(o&&o.spots)?o.spots:(o&&o.data&&Array.isArray(o.data.spots)?o.data.spots:(Array.isArray(o)?o:null));
      if(!arr){lb.msg="檔案裡找不到景點。";lb.imp=null;lbDraw();return}
      var list=[];arr.slice(0,500).forEach(function(x){var c=lbClean(x);if(c)list.push(c)});
      if(!list.length){lb.msg="檔案裡沒有可匯入的景點。";lb.imp=null;lbDraw();return}
      lb.imp=list.map(function(sp){var dup=s.spots.some(function(e){return lbSame(sp,e)});return {sp:sp,dup:dup,on:!dup}});
      lb.fname=file.name;lb.msg="";lb.fcat={};lb.farea={};lbDraw();
    },function(){lb.msg="讀取檔案失敗。";lbDraw()});
  }
  function lbImport(){
    var pick=lb.imp.filter(function(x){return x.on});if(!pick.length)return;
    pick.slice().reverse().forEach(function(x){s.spots.unshift(x.sp)});
    var dup=pick.filter(function(x){return x.dup}).length;
    save();render();lbClose();
    say("已匯入 "+pick.length+" 個景點"+(dup?"（含 "+dup+" 個已有類似的）":"")+"。");
  }
  function lbBind(){
    lbEl.addEventListener("click",function(e){
      var t=e.target;
      if(t.closest(".bk,.x")){lbClose();return}
      var b=t.closest("button");if(!b)return;
      if(b.dataset.lbtab){lb.tab=b.dataset.lbtab;lb.msg="";lb.fcat={};lb.farea={};lb.fb="";lbDraw();return}
      if(b.dataset.lbfc!==undefined){var c=b.dataset.lbfc;if(lb.fcat[c])delete lb.fcat[c];else lb.fcat[c]=1;lbDraw();return}
      if(b.dataset.lbfa!==undefined){var a=b.dataset.lbfa;if(lb.farea[a])delete lb.farea[a];else lb.farea[a]=1;lbDraw();return}
      if(b.dataset.lball){
        if(lb.tab==="out")lbFilterRows(s.spots).forEach(function(sp){lb.sel[sp.id]=1});
        else{var vis={};lbFilterRows(lb.imp.map(function(x){return x.sp})).forEach(function(sp){vis[sp.id]=1});lb.imp.forEach(function(x){if(vis[x.sp.id])x.on=true})}
        lbDraw();return}
      if(b.dataset.lbnone){if(lb.tab==="out")lb.sel={};else lb.imp.forEach(function(x){x.on=false});lbDraw();return}
      if(b.dataset.lbexp){lbExport();return}
      if(b.dataset.lbpick){var f=document.getElementById("lbFile");if(!f){f=document.createElement("input");f.type="file";f.id="lbFile";f.accept=".json,application/json";f.hidden=true;document.body.appendChild(f);f.onchange=function(){var fl=f.files&&f.files[0];f.value="";if(fl)lbRead(fl)}}f.click();return}
      if(b.dataset.lbimp){lbImport();return}
    });
    lbEl.addEventListener("change",function(e){
      var t=e.target;
      if(t.dataset.lbsel){
        if(lb.tab==="out"){if(t.checked)lb.sel[t.dataset.lbsel]=1;else delete lb.sel[t.dataset.lbsel]}
        else lb.imp.forEach(function(x){if(x.sp.id===t.dataset.lbsel)x.on=t.checked});
        lbDraw();return}
      if(t.id==="lbImg"){lb.img=t.checked}
    });
    document.addEventListener("keydown",function(e){if(e.key==="Escape"&&lbEl&&lbEl.classList.contains("on"))lbClose()});
  }
  document.addEventListener("click",function(e){if(e.target.closest&&e.target.closest("#libBatch"))lbOpen()});
  if(viewerMode){applyTheme()}else{drawTripSel();updateShareUI();render()}
})();
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut, reauthenticateWithPopup, deleteUser } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
import { initializeFirestore, doc, getDoc, setDoc, deleteDoc, collection, getDocs, writeBatch, onSnapshot, arrayUnion, query, where } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDOyFkCSTcjRmeodaS-O3w-WKkWfsaJ3ls",
  authDomain: "hthsieh-7b870.firebaseapp.com",
  projectId: "hthsieh-7b870",
  storageBucket: "hthsieh-7b870.firebasestorage.app",
  messagingSenderId: "537319375553",
  appId: "1:537319375553:web:4fabfc4ee2259776048a40"
};

try {
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = initializeFirestore(app, { experimentalAutoDetectLongPolling: true });
  const metaRef = (uid) => doc(db, "users", uid, "meta", "main");
  const tripsCol = (uid) => collection(db, "users", uid, "trips");
  const tripRef = (uid, id) => doc(db, "users", uid, "trips", id);
  const tSpots = (uid, id) => collection(db, "users", uid, "trips", id, "spots");
  const tSpot = (uid, id, sid) => doc(db, "users", uid, "trips", id, "spots", sid);
  const shareRef = (sid) => doc(db, "shares", sid);
  const sSpots = (sid) => collection(db, "shares", sid, "spots");
  const sSpot = (sid, id) => doc(db, "shares", sid, "spots", id);

  async function runOps(ops) {
    for (let i = 0; i < ops.length; i += 450) {
      const b = writeBatch(db);
      ops.slice(i, i + 450).forEach((f) => f(b));
      await b.commit();
    }
  }
  async function clearCol(col) {
    const qs = await getDocs(col);
    await runOps(qs.docs.map((d) => (b) => b.delete(d.ref)));
  }

  window.cloud = {
    onAuth(cb) { return onAuthStateChanged(auth, (u) => cb(u && !u.isAnonymous ? { uid: u.uid, email: u.email, displayName: u.displayName } : null)); },  // 分帳頁的匿名朋友不算登入
    signIn() { return signInWithPopup(auth, new GoogleAuthProvider()); },
    signOut() { return signOut(auth); },
    reauth() { const u = auth.currentUser; if (!u) return Promise.reject(new Error("not-signed-in")); return reauthenticateWithPopup(u, new GoogleAuthProvider()); },
    async deleteAccount() {
      const user = auth.currentUser; if (!user) throw new Error("not-signed-in");
      const uid = user.uid;
      const qs = await getDocs(tripsCol(uid));
      for (const d of qs.docs) {
        const t = d.data() || {};
        const sid = t.shareId;
        if (typeof sid === "string" && /^[A-Za-z0-9_-]{10,64}$/.test(sid)) await this.unshare(sid);
        await clearCol(tSpots(uid, d.id));
        await deleteDoc(d.ref);
      }
      try {  // 分帳頁：連同自己擁有的共同帳本一起刪除
        const owned = await getDocs(query(collection(db, "splits"), where("owner", "==", uid)));
        for (const d of owned.docs) {
          await clearCol(collection(db, "splits", d.id, "expenses"));
          await clearCol(collection(db, "splits", d.id, "people"));
          await deleteDoc(d.ref);
        }
      } catch (e) {}
      try { await clearCol(collection(db, "users", uid, "spots")); } catch (e) {}
      try { await deleteDoc(doc(db, "users", uid, "trip", "main")); } catch (e) {}
      await deleteDoc(metaRef(uid));
      await deleteUser(user);
    },
    async pullMeta(uid) { const m = await getDoc(metaRef(uid)); return m.exists() ? m.data() : null; },
    async setMeta(uid, data) { await setDoc(metaRef(uid), data, { merge: true }); },
    async listTrips(uid) { const qs = await getDocs(tripsCol(uid)); return qs.docs.map((d) => ({ ...d.data(), id: d.id })); },
    async pullTrip(uid, id) {
      const t = await getDoc(tripRef(uid, id));
      if (!t.exists()) return null;
      const qs = await getDocs(tSpots(uid, id));
      return { trip: t.data(), spots: qs.docs.map((d) => ({ ...d.data(), id: d.id })) };
    },
    async pullLegacy(uid) {
      const t = await getDoc(doc(db, "users", uid, "trip", "main"));
      if (!t.exists()) return null;
      const qs = await getDocs(collection(db, "users", uid, "spots"));
      return { trip: t.data(), spots: qs.docs.map((d) => ({ ...d.data(), id: d.id })) };
    },
    async pushTrip(uid, id, trip, changed, removed, keep, share) {
      if (share) {
        await setDoc(shareRef(share.id), share.doc, { merge: true });
      }
      const ops = [];
      changed.forEach((sp) => ops.push((b) => b.set(tSpot(uid, id, sp.id), sp)));
      removed.forEach((sid) => ops.push((b) => b.delete(tSpot(uid, id, sid))));
      if (keep) {
        const qs = await getDocs(tSpots(uid, id));
        const ks = new Set(keep);
        qs.docs.forEach((d) => { if (!ks.has(d.id)) ops.push((b) => b.delete(d.ref)); });
      }
      if (share) {
        if (share.all) {
          const qs = await getDocs(sSpots(share.id));
          const ks = new Set(share.all.map((x) => x.id));
          qs.docs.forEach((d) => { if (!ks.has(d.id)) ops.push((b) => b.delete(d.ref)); });
          share.all.forEach((sp) => ops.push((b) => b.set(sSpot(share.id, sp.id), sp)));
        } else {
          changed.forEach((sp) => ops.push((b) => b.set(sSpot(share.id, sp.id), sp)));
          removed.forEach((sid) => ops.push((b) => b.delete(sSpot(share.id, sid))));
        }
      }
      await runOps(ops);
      await setDoc(tripRef(uid, id), trip);
    },
    async deleteTrip(uid, id, sid) {
      await setDoc(metaRef(uid), { deleted: arrayUnion(id) }, { merge: true });
      if (sid) { try { await this.unshare(sid); } catch (e) {} }
      await clearCol(tSpots(uid, id));
      await deleteDoc(tripRef(uid, id));
    },
    async unshare(sid) {
      await clearCol(sSpots(sid));
      try { await clearCol(collection(db, "shares", sid, "suggestions")); } catch (e) {}
      await deleteDoc(shareRef(sid));
    },
    async getShare(sid) {
      const t = await getDoc(shareRef(sid));
      if (!t.exists()) return null;
      const qs = await getDocs(sSpots(sid));
      return { trip: t.data(), spots: qs.docs.map((d) => ({ ...d.data(), id: d.id })) };
    },
    async suggestAdd(sid, data) { await setDoc(doc(collection(db, "shares", sid, "suggestions")), data); },
    async suggestList(sid) { const qs = await getDocs(collection(db, "shares", sid, "suggestions")); return qs.docs.map((d) => ({ ...d.data(), id: d.id })); },
    async suggestDel(sid, id) { await deleteDoc(doc(db, "shares", sid, "suggestions", id)); },
    listenTrips(uid, cb) {
      return onSnapshot(tripsCol(uid), (snap) => cb(snap.docChanges().map((c) => ({ type: c.type, id: c.doc.id, data: c.doc.data() }))), () => {});
    }
  };
  window.dispatchEvent(new Event("cloud-ready"));
} catch (e) {
  console.error("Firebase init failed", e);
}
</script>
